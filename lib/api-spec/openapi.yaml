            Health of the background dead-connection sweep. Null when the
            sweep has never completed a run (e.g. fresh deploy).
          required:
            - lastRunAt
            - durationMs
            - accountsChecked
            - errorCount
          properties:
            lastRunAt:
              type: string
              format: date-time
            durationMs:
              type: integer
            accountsChecked:
              type: integer
            errorCount:
              type: integer
            failRatioAlertThreshold:
              type: number
              description: >-
                Fraction (0-1) of failed checks per run at or above which the
                sweep fires a mass-outage superadmin alert. Exposed so the
                dashboard can flag the last run's failure ratio using the
                same server-side threshold instead of hardcoding one.
            lastError:
              type: [string, "null"]
            droppedStreaks:
              type: integer
              description: >-
                How many failing checks were trimmed from the persisted
                cross-run failure history when it exceeded its cap during
                the last run. Non-zero means the dashboard is NOT showing
                the full failure picture (e.g. a platform-wide outage broke
                more connections than the history keeps).
            recentFailures:
              type: array
              description: >-
                Most recent failed checks from the last completed sweep run,
                newest first (capped server-side), so an admin can see which
                tenant + platform keeps timing out without reading logs.
              items:
                type: object
                required: [tenantId, platform, error, at]
                properties:
                  tenantId:
                    type: integer
                  tenantName:
                    type: [string, "null"]
                    description: Workspace name, null if the tenant was deleted.
                  platform:
                    type: string
                  error:
                    type: string
                  at:
                    type: string
                    format: date-time
                  consecutiveFailures:
                    type: integer
                    description: >-
                      How many sweeps in a row this tenant+platform check has
                      failed, including this one. Values above 1 mark a
                      chronic breakage rather than a one-off blip; the tally
                      resets the first sweep the check succeeds.
                  firstFailedAt:
                    type: string
                    format: date-time
                    description: >-
                      When the current failure streak began, so admins can see
                      how long the check has been failing without doing
                      sweep-interval math. For rows recorded before this field
                      existed the server falls back to the failure's own
                      timestamp.
    AdminSweepRunResult:
      type: object
      required: [started]
      properties:
        started:
          type: boolean
          description: >-
            True when a background sweep was started; false when one was
            already running and the request was a no-op.
    UpdateTenantPlanBody:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          minLength: 1
          maxLength: 40
        confirmActiveSubscription:
          type: boolean
          description: >-
            Must be true to override the plan of a tenant that has an active
            Razorpay subscription. Without it the request is rejected with 409
            so the admin UI can warn first.
