    PostMetrics:
      type: object
      description: >-
        Latest engagement snapshot for one published post (one row per
        content item per platform). Counters are cumulative platform totals.
      required:
        [
          id,
          contentItemId,
          platform,
          likes,
          comments,
          shares,
          impressions,
          publishedAt,
          pollState,
        ]
      properties:
        id:
          type: integer
        contentItemId:
          type: integer
        platform:
          type: string
        likes:
          type: integer
        comments:
          type: integer
        shares:
          type: integer
        impressions:
          type: integer
          description: Reach/impressions where the platform exposes it; 0 when unavailable.
        publishedAt:
          type: string
          format: date-time
        fetchedAt:
          type: ["string", "null"]
          format: date-time
          description: Last successful metrics fetch; null until the first poll lands.
        pollState:
          type: string
          enum: [active, done, failed]
          description: >-
            active = still being refreshed on the decay schedule; done =
            tracking window (14 days) ended; failed = the platform
            definitively rejected the lookup (see failureReason).
        failureReason:
          type: ["string", "null"]
