  /ai/generate-caption/stream:
    post:
      operationId: streamCaption
      tags: [ai]
      summary: Generate an AI caption as a Server-Sent Events stream
      description: >-
        SSE variant of generateCaption for lower perceived latency. Emits
        `data:` lines of JSON events: {type:"delta", text} as caption text
        becomes available, then a terminal {type:"result", caption, hashtags,
        title?, clarifyingQuestions?} or {type:"error", message}. Quota and
        credit behavior is identical to generateCaption; a client disconnect
        mid-stream settles (charges) the reserved funding if any caption text
        was already delivered, and releases it only when nothing was sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptionRequest"
      responses:
        "200":
          description: SSE stream of caption events
          content:
            text/event-stream:
              schema:
                type: string
        "402":
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ai/generate-image-async:
    post:
      operationId: generateImageAsync
      tags: [ai]
      summary: Start a background image generation job
      description: >-
        Async variant of generateImage: validates the request, reserves
        funding (monthly quota first, then an image credit), creates the job,
        and returns immediately. Poll GET /ai/image-jobs/{jobId} until status
        is succeeded or failed. Gated by the imageJobs feature switch; when
        disabled, clients should fall back to the synchronous route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRequest"
      responses:
        "201":
          description: Job created and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageJob"
        "402":
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ai/image-jobs:
    get:
      operationId: listImageJobs
      tags: [ai]
      summary: List this workspace's recent image generation jobs (newest first)
      responses:
        "200":
          description: Recent image jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImageJob"
  /ai/image-jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getImageJob
      tags: [ai]
      summary: Get one image generation job (poll until succeeded/failed)
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ai/image-jobs/{jobId}/cancel:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: cancelImageJob
      tags: [ai]
      summary: Cancel a still-queued image generation job
      description: >-
        Marks a queued job cancelled and refunds its credit funding (if it was
        credit-funded). Jobs that have already started processing cannot be
        cancelled and return 409.
      responses:
        "200":
          description: The cancelled job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageJob"
        "409":
          description: Job already started, finished, or was already cancelled
          content:
