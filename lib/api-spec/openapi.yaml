  /ai/video-styles:
    get:
      operationId: listVideoStyles
      tags: [ai]
      summary: List saved video style profiles
      responses:
        "200":
          description: Style profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoStyleProfile"
    post:
      operationId: analyzeVideoStyle
      tags: [ai]
      summary: Analyze an uploaded reference video into a reusable style profile
      description: >-
        Measures the reference (duration, scene count, narration speed) and
        describes its structure with one vision call over sampled frames. Costs
        one caption unit. References are uploads only; nothing is fetched from
        a third-party host, and no footage, audio, or wording from the
        reference is stored or reused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeVideoStyleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoStyleProfile"
        "400":
          description: Invalid input or style limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: Caption quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: The video could not be analyzed (unreadable, too long, or no usable reply)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Text generation is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
