    AiSpendSettingsView:
      type: object
      description: Platform-wide "AI amount spent" display configuration (superadmin).
      required: [captionCostPaise, imageCostPaise, feePercent]
      properties:
        captionCostPaise:
          type: integer
          description: Base AI cost per generated caption, in paise (before the platform fee).
        imageCostPaise:
          type: integer
          description: Base AI cost per generated image, in paise (before the platform fee).
        feePercent:
          type: integer
          description: Whole-number platform fee percentage added on top of the base costs.
    UpdateAiSpendSettingsRequest:
      type: object
      required: [captionCostPaise, imageCostPaise, feePercent]
      properties:
        captionCostPaise:
          type: integer
          minimum: 0
        imageCostPaise:
          type: integer
          minimum: 0
        feePercent:
          type: integer
          minimum: 0
          maximum: 1000
    AiSpendRatesView:
      type: object
      description: Effective per-unit display amounts (base cost + platform fee, combined).
      required: [captionPaise, imagePaise]
      properties:
        captionPaise:
          type: integer
          description: Amount shown per generated caption, in paise (fee included).
        imagePaise:
          type: integer
          description: Amount shown per generated image, in paise (fee included).
    AiModelPriceView:
      type: object
      description: One admin-maintained provider price row (USD) used for actual-cost computation.
      required: [id, kind, provider, model, inputUsdPerMtok, outputUsdPerMtok, usdPerImage]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [text, image]
        provider:
          type: string
          description: Provider id as recorded on usage events (e.g. builtin, openrouter, gemini).
        model:
          type: string
        inputUsdPerMtok:
          type: ["number", "null"]
          description: Text models — USD per 1M input tokens.
        outputUsdPerMtok:
          type: ["number", "null"]
          description: Text models — USD per 1M output tokens.
        usdPerImage:
          type: ["number", "null"]
          description: Image models — USD per generated image.
    AiCostConfigView:
      type: object
      description: Actual-cost configuration — USD→INR rate plus the model price catalog.
      required: [usdToInrPaise, prices]
      properties:
        usdToInrPaise:
          type: integer
          description: Paise per 1 USD (0 = unset; computed costs stay unknown).
        prices:
          type: array
          items:
            $ref: "#/components/schemas/AiModelPriceView"
    UpdateAiCostRateRequest:
      type: object
      required: [usdToInrPaise]
      properties:
        usdToInrPaise:
          type: integer
          minimum: 0
          maximum: 100000
    UpsertAiModelPriceRequest:
      type: object
      required: [kind, provider, model]
      properties:
        kind:
          type: string
          enum: [text, image]
        provider:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 200
        inputUsdPerMtok:
          type: ["number", "null"]
          minimum: 0
        outputUsdPerMtok:
          type: ["number", "null"]
          minimum: 0
        usdPerImage:
          type: ["number", "null"]
          minimum: 0
    AiCostReportTenantRow:
      type: object
      description: One tenant's actual AI cost for the reporting month.
      required:
        [
          tenantId,
          name,
          email,
          captionCount,
          imageCount,
          captionCostPaise,
          imageCostPaise,
          totalCostPaise,
          unknownCaptionCount,
          unknownImageCount,
          displaySpendPaise,
        ]
      properties:
        tenantId:
          type: integer
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        captionCount:
          type: integer
        imageCount:
          type: integer
        captionCostPaise:
          type: integer
          description: Sum of known caption costs, in paise.
        imageCostPaise:
          type: integer
          description: Sum of known image costs, in paise.
        totalCostPaise:
          type: integer
        unknownCaptionCount:
          type: integer
          description: Caption events with no computed cost (unknown model or unset rate).
        unknownImageCount:
          type: integer
        displaySpendPaise:
          type: integer
          description: What the tenant-facing "AI amount spent" rates would show for the same volume (fee included), for margin comparison.
    AiCostReportView:
      type: object
      required: [month, months, displayRates, summary, trend, tenants]
      properties:
        month:
          type: string
          description: Reporting month, YYYY-MM (UTC).
        months:
          type: array
          description: Months that have any usage, newest first.
          items:
            type: string
        displayRates:
          $ref: "#/components/schemas/AiSpendRatesView"
        summary:
          $ref: "#/components/schemas/AiCostReportMonthTotal"
          description: Platform-wide totals for the selected month.
        trend:
          type: array
          description: Platform totals per month, newest first (up to 12 months).
          items:
            $ref: "#/components/schemas/AiCostReportMonthTotal"
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/AiCostReportTenantRow"
    AiCostReportMonthTotal:
      type: object
      required:
        [
          month,
          captionCount,
          imageCount,
          totalCostPaise,
          displaySpendPaise,
          unknownCount,
        ]
      properties:
        month:
          type: string
          description: Month, YYYY-MM (UTC).
        captionCount:
          type: integer
        imageCount:
          type: integer
        totalCostPaise:
          type: integer
          description: Sum of known per-event costs, in paise.
        displaySpendPaise:
          type: integer
          description: What the current tenant-facing rates would display for this volume, in paise.
        unknownCount:
          type: integer
          description: Events in the month with no computed cost.
