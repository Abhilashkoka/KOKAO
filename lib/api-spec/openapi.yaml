          type: boolean
          description: Present (true) on approve responses when the apply failed because the platform revoked or expired our access — the connection was marked failed and the client should refetch connections.
        createdAt:
          type: string
          format: date-time
    AdsDraftCreateInput:
      type: object
      required: [connectionId, targetType, action]
      properties:
        connectionId:
          type: integer
        targetType:
          type: string
          enum: [campaign, adset, ad, campaign_group, creative]
          description: campaign_group is LinkedIn-only (create and update); creative is LinkedIn-only (create, plus status-only updates).
        action:
          type: string
          enum: [create, update]
        targetId:
          type: string
          description: Remote object id (required for update).
        idempotencyKey:
          type: string
          maxLength: 128
          description: Client-supplied key to make retries safe; server generates one when omitted.
        name:
          type: string
          maxLength: 400
        status:
          type: string
          enum: [ACTIVE, PAUSED, ARCHIVED]
          description: ARCHIVED is only accepted for LinkedIn creative status updates.
        objective:
          type: string
          description: Campaign objective (Meta create only), e.g. OUTCOME_TRAFFIC.
        campaignGroupId:
          type: string
          description: LinkedIn only — campaign group to create the campaign in (required for LinkedIn creates).
        dailyBudget:
          type: ["integer", "null"]
          minimum: 0
          description: Daily budget in minor currency units.
        lifetimeBudget:
          type: ["integer", "null"]
          minimum: 0
          description: Lifetime budget in minor currency units.
        removeLifetimeBudget:
          type: boolean
          description: LinkedIn campaign group updates only — remove the group's lifetime budget entirely (mutually exclusive with lifetimeBudget).
        startTime:
          type: ["string", "null"]
          description: ISO-8601 schedule start.
        stopTime:
          type: ["string", "null"]
          description: ISO-8601 schedule end.
        bidAmount:
          type: ["integer", "null"]
          minimum: 1
          description: Meta ad set updates only — bid cap / cost cap amount in minor currency units.
        bidStrategy:
          type: ["string", "null"]
          enum: [LOWEST_COST_WITHOUT_CAP, LOWEST_COST_WITH_BID_CAP, COST_CAP, null]
          description: Meta ad set updates only — bid strategy (requires the ad set to hold its own budget).
        campaignId:
          type: string
          description: LinkedIn creative creates — the campaign the creative attaches to.
        text:
          type: string
          maxLength: 3000
          description: LinkedIn creative creates — the sponsored post's text.
        imagePath:
          type: ["string", "null"]
          description: LinkedIn creative creates — content library image path (`/objects/<tenantId>/uploads/<uuid>`).
        landingUrl:
          type: ["string", "null"]
          description: LinkedIn creative creates — click-through landing page URL (https).
        targetingLocations:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AdsTargetingLocation"
          description: LinkedIn campaigns — replacement location targeting (geo URNs picked via targeting search). Must be non-empty when provided.
        targetingIndustries:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AdsTargetingLocation"
          description: LinkedIn campaign updates — replacement industry targeting (urn:li:industry URNs). An empty array clears the facet.
        targetingJobFunctions:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AdsTargetingLocation"
          description: LinkedIn campaign updates — replacement job function targeting (urn:li:function URNs). An empty array clears the facet.
        targetingTitles:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AdsTargetingLocation"
          description: LinkedIn campaign updates — replacement job title targeting (urn:li:title URNs). An empty array clears the facet.
    AdsTargetingLocation:
      type: object
      required: [urn, name]
      properties:
        urn:
          type: string
          description: LinkedIn targeting entity URN, e.g. urn:li:geo:103644278 or urn:li:industry:4.
        name:
          type: string
    AdsCampaignTargeting:
      type: object
      required: [locations, industries, jobFunctions, titles]
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/AdsTargetingLocation"
        industries:
          type: array
          items:
            $ref: "#/components/schemas/AdsTargetingLocation"
        jobFunctions:
          type: array
          items:
            $ref: "#/components/schemas/AdsTargetingLocation"
        titles:
          type: array
          items:
            $ref: "#/components/schemas/AdsTargetingLocation"
      description: A campaign's current targeting per managed facet; names fall back to the raw URN when LinkedIn can't resolve them.
    AdsGeoSearchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/AdsTargetingLocation"
    AdsChangeLogEntry:
