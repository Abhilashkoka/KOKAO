        testedAt:
          type: ["string", "null"]
          format: date-time
        testError:
          type: ["string", "null"]
    EmailSettingsInput:
      type: object
      required: [sendingEnabled]
      properties:
        sendingEnabled:
          type: boolean
          description: Global pause switch. When false, no email is ever sent.
        fromEmail:
          type: string
          description: Verified SendGrid sender address (overrides the connector).
        apiKey:
          type: string
          description: >-
            SendGrid API key (write-only). Omit to keep the stored key; provide
            to replace it. Stored encrypted, never returned.
    EmailSettingsStatus:
      type: object
      required: [sendingEnabled, connectorAvailable, configured]
      properties:
        sendingEnabled:
          type: boolean
          description: Whether outbound email is currently allowed to send.
        fromEmail:
          type: ["string", "null"]
          description: The configured sender address, if any.
        apiKeyMasked:
          type: ["string", "null"]
          description: Masked stored API key, or null when none is stored.
        connectorAvailable:
          type: boolean
          description: Whether the Replit-managed SendGrid connector is connected.
        configured:
          type: boolean
          description: >-
            Whether credentials exist to send with (stored API key or the
            connected connector). Ignores the pause switch.
        testStatus:
          type: ["string", "null"]
          description: '"verified" or "failed" from the last test send.'
        testedAt:
          type: ["string", "null"]
          format: date-time
        testError:
          type: ["string", "null"]
