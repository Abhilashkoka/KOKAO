          type: string
        contentType:
          type: string
        status:
          type: string
        failureReason:
          type: ["string", "null"]
          description: >-
            Why the last publish attempt failed. Set to a canonical
            restart-interruption message when the server auto-failed an
            orphaned "publishing" item, or a platform rejection message on a
            real publish failure. Null when not failed.
        postId:
          type: ["string", "null"]
        permalink:
          type: ["string", "null"]
        publishedPlatforms:
          type: object
          description: >-
            Map of platform name -> publish record for every platform this
            item has been successfully published to. postId/permalink above
            only reflect the latest publish; this map is the cumulative list
            the UI shows.
          additionalProperties:
            type: object
            required: [publishedAt]
            properties:
              postId:
                type: ["string", "null"]
              permalink:
                type: ["string", "null"]
              publishedAt:
                type: string
                format: date-time
        linkedinCommentsPending:
          type: integer
          description: >-
            How many LinkedIn follow-up comments from the last publish are
            still missing (0 when none). When > 0 the client can offer a
            "resend remaining comments" action.
