        redirectUri:
          type: string
          description: The exact OAuth redirect URL to register in the Meta app's Threads API settings.
        expired:
          type: boolean
          description: >-
            True when a profile was previously connected but its access has
            since expired or been revoked, so the user should reconnect.
    ThreadsAppCredentialInput:
      type: object
      required: [appId, appSecret]
      properties:
        appId:
          type: string
          minLength: 1
        appSecret:
          type: string
          minLength: 1
    ThreadsAppCredentialStatus:
      type: object
      required: [configured, redirectUri]
      properties:
        configured:
          type: boolean
          description: Whether Threads app credentials have been saved.
        appIdMasked:
          type: ["string", "null"]
        appSecretMasked:
          type: ["string", "null"]
        redirectUri:
          type: string
          description: The exact OAuth redirect URL to register in the Meta app's Threads API settings.
        savedAt:
          type: ["string", "null"]
          format: date-time
    PublishThreadsResult:
      type: object
      required: [postId]
      properties:
        postId:
          type: string
        permalink:
          type: ["string", "null"]
        postsPublished:
          type: integer
          description: How many posts of the reply-chained thread were published.
        postsTotal:
          type: integer
          description: How many posts the caption required.
        publishWarning:
          type: ["string", "null"]
          description: >-
            Present when the first post published but some follow-up replies
            with the rest of the caption could not be posted.
    TwitterAppCredentialInput:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId:
          type: string
          minLength: 1
        clientSecret:
          type: string
          minLength: 1
    TwitterAppCredentialStatus:
      type: object
      required: [configured, redirectUri]
      properties:
        configured:
          type: boolean
          description: Whether X OAuth 2.0 client credentials have been saved.
        clientIdMasked:
          type: ["string", "null"]
        clientSecretMasked:
          type: ["string", "null"]
        redirectUri:
          type: string
          description: The exact OAuth 2.0 callback URL to register in the X app.
        savedAt:
          type: ["string", "null"]
          format: date-time
    TiktokAppCredentialInput:
      type: object
      required: [appId, appSecret]
      properties:
        appId:
          type: string
          minLength: 1
        appSecret:
          type: string
          minLength: 1
    TiktokAppCredentialStatus:
      type: object
      required: [configured, redirectUri]
      properties:
        configured:
          type: boolean
          description: Whether TikTok for Business app credentials have been saved.
        appIdMasked:
          type: ["string", "null"]
        appSecretMasked:
          type: ["string", "null"]
        redirectUri:
          type: string
          description: The exact OAuth redirect URL to register in the TikTok for Business developer app.
        savedAt:
          type: ["string", "null"]
          format: date-time
    TwitterAuthUrlResult:
      type: object
      required: [url]
      properties:
        url:
          type: string
    TwitterStatus:
      type: object
      required: [connected, configured, redirectUri]
      properties:
        connected:
          type: boolean
        accountName:
          type: ["string", "null"]
        configured:
          type: boolean
          description: Whether the platform-level X OAuth 2.0 client credentials are set by the admin.
        redirectUri:
          type: string
          description: The exact OAuth 2.0 callback URL to register in the X app.
        expired:
          type: boolean
          description: >-
            True when an account was previously connected but its token can no
            longer be used (expired/revoked, or a legacy OAuth 1.0a connection),
            so the user should reconnect.
    PublishTwitterResult:
      type: object
      required: [postId]
      properties:
        postId:
          type: string
        permalink:
          type: ["string", "null"]
        tweetCount:
          type: integer
          description: >
            Number of tweets posted. Greater than 1 when a long caption was
            split into a reply-chained thread.
        publishWarning:
          type: ["string", "null"]
          description: >-
            Present when the first tweet published but some follow-up tweets
            with the rest of the caption could not be posted.
    ContentItem:
      type: object
      required:
        - id
        - title
        - caption
        - platform
        - contentType
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        title:
          type: string
        caption:
          type: string
        imagePath:
          type: ["string", "null"]
        imagePrompt:
          type: ["string", "null"]
        videoPath:
          type: ["string", "null"]
          description: >-
            Storage path of the video attached to this item (from the Video
            Studio). When set, clients render a video player instead of an
            image.
        videoThumbnailPath:
          type: ["string", "null"]
          description: Poster-frame image path used by grids and previews.
        carouselSlides:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/CarouselSlide"
        platform:
          type: string
        contentType:
          type: string
        status:
          type: string
        failureReason:
          type: ["string", "null"]
          description: >-
            Why the last publish attempt failed. Set to a canonical
            restart-interruption message when the server auto-failed an
            orphaned "publishing" item, or a platform rejection message on a
            real publish failure. Null when not failed.
        postId:
          type: ["string", "null"]
        permalink:
          type: ["string", "null"]
        publishedPlatforms:
          type: object
          description: >-
            Map of platform name -> publish record for every platform this
            item has been successfully published to. postId/permalink above
            only reflect the latest publish; this map is the cumulative list
            the UI shows.
          additionalProperties:
            type: object
            required: [publishedAt]
            properties:
              postId:
                type: ["string", "null"]
              permalink:
                type: ["string", "null"]
              publishedAt:
                type: string
                format: date-time
        linkedinCommentsPending:
          type: integer
          description: >-
            How many LinkedIn follow-up comments from the last publish are
            still missing (0 when none). When > 0 the client can offer a
            "resend remaining comments" action.
        threadsPostsPending:
          type: integer
          description: >-
            How many Threads reply-chain posts from the last publish are
            still missing (0 when none). When > 0 the client can offer a
            "resend missing posts" action.
        twitterPostsPending:
          type: integer
          description: >-
            How many X thread posts from the last publish are still missing
            (0 when none). When > 0 the client can offer a "resend missing
            posts" action.
        brandKitId:
          type: ["integer", "null"]
        campaignId:
          type: ["integer", "null"]
          description: Campaign this item belongs to; null when unattached.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContentInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        caption:
          type: string
        imagePath:
          type: ["string", "null"]
        imagePrompt:
          type: ["string", "null"]
        videoPath:
          type: ["string", "null"]
        videoThumbnailPath:
          type: ["string", "null"]
        carouselSlides:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/CarouselSlide"
        platform:
          type: string
        contentType:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
        brandKitId:
          type: ["integer", "null"]
        campaignId:
          type: ["integer", "null"]
    ContentUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        caption:
          type: string
        imagePath:
          type: ["string", "null"]
        imagePrompt:
          type: ["string", "null"]
        videoPath:
          type: ["string", "null"]
        videoThumbnailPath:
          type: ["string", "null"]
        carouselSlides:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/CarouselSlide"
        platform:
          type: string
        contentType:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
        brandKitId:
          type: ["integer", "null"]
        campaignId:
          type: ["integer", "null"]
          description: Set to attach the item to a campaign; null to detach.

    CarouselSlide:
      type: object
      required: [heading, body, imagePrompt, imagePath]
      properties:
        heading:
          type: string
          description: Short slide headline.
        body:
          type: string
          description: Supporting copy for the slide.
        imagePrompt:
          type: string
          description: AI image-generation prompt for this slide's visual.
        imagePath:
          type: ["string", "null"]
          description: Storage path of the generated slide image; null until generated.
    CarouselRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          description: Topic, idea, or summary to base the carousel on.
        slideCount:
          type: integer
          minimum: 2
          maximum: 10
          default: 5
        platform:
          type: string
          description: Primary target platform (e.g. linkedin, instagram).
        brandKitId:
          type: ["integer", "null"]
        tone:
          type: string
    CarouselResult:
      type: object
      required: [slides]
      properties:
        title:
          type: string
          description: Short creative-brief title for the carousel.
        caption:
          type: string
          description: Post caption to accompany the carousel.
        hashtags:
          type: array
          items:
            type: string
        slides:
          type: array
          items:
            $ref: "#/components/schemas/CarouselSlide"
        carouselId:
          type: string
          description: Correlates follow-up image generations and data metering
        clarifyingQuestions:
          type: array
          description: >-
            Present (non-empty) when the brief was too thin. When set, slides
            is empty and nothing was charged.
          items:
            type: string
    CaptionRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          description: Topic or idea for the post.
        platform:
          type: string
        brandKitId:
          type: ["integer", "null"]
        tone:
          type: string
    CaptionResult:
      type: object
      required: [caption, hashtags]
      properties:
        caption:
          type: string
        hashtags:
          type: array
          items:
            type: string
        title:
          type: string
          description: Short creative-brief title for this piece of content.
        clarifyingQuestions:
          type: array
          description: >-
            Present (non-empty) when the brief was too thin to write an
            effective post. Contains the questions the user should answer;
            when set, caption/hashtags are empty and nothing was charged.
          items:
            type: string
    ImagePromptRecipe:
      type: object
      description: >-
        Optional photographic direction picked from the studio's Look pills. The
        server compiles these ids together with the brief into a single prompt;
        each axis set here overrides the preset's default for that axis, and an
        axis is usable on its own without a preset.
      properties:
        preset:
          type: string
          enum: [product, food, fashion, lifestyle, architecture]
        camera:
          type: string
          enum: [phone, mirrorless, dslr, medium-format, film35]
        lens:
          type: string
          enum: [wide-24, reportage-35, natural-50, portrait-85, macro-100, tele-135]
        aperture:
          type: string
          enum: ["f1.4", "f2.8", "f5.6", "f8", "f16"]
        lighting:
          type: string
          enum: [softbox, window, golden-hour, flash, overcast, neon]
    ImageRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        promptRecipe:
          $ref: "#/components/schemas/ImagePromptRecipe"
        size:
          type: string
          enum: ["1024x1024", "1536x1024", "1024x1536"]
        brandKitId:
          type: ["integer", "null"]
        campaignId:
          type: ["string", "null"]
          description: Ties this image's data usage to a generated campaign
        platform:
          type: ["string", "null"]
          description: Target platform, for per-platform data metering
        referenceImagePath:
          type: ["string", "null"]
          description: >-
            Optional object-storage path (/objects/<tenantId>/uploads/<uuid>) of a
            tenant-uploaded reference image to guide the generation. The server
            analyzes it into a style guide and, when the selected provider supports
            image input, also passes the image itself.
    ImageResult:
      type: object
      required: [imagePath, b64Json]
      properties:
        imagePath:
          type: string
        b64Json:
          type: string
    ImageJob:
      type: object
      required: [id, status, prompt, size, createdAt, updatedAt]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [queued, processing, succeeded, failed, cancelled]
        prompt:
          type: string
        size:
          type: string
        brandKitId:
          type: ["integer", "null"]
        campaignId:
          type: ["string", "null"]
        platform:
          type: ["string", "null"]
        imagePath:
          type: ["string", "null"]
          description: Set when status is succeeded; render via /api/storage{imagePath}.
        provider:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        durationMs:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
    VideoGenerateRequest:
      type: object
      required: [engine]
      properties:
        engine:
          type: string
          enum: [text_to_video, image_to_video, slideshow, topic_to_video]
        prompt:
          type: ["string", "null"]
          maxLength: 2000
          description: >-
            The brief. Required for text_to_video; an optional motion hint for
            image_to_video; the video topic for topic_to_video; unused by
            slideshow.
        sourceImagePaths:
          type: ["array", "null"]
          maxItems: 20
          items:
            type: string
          description: >-
            Ordered /objects/... photo paths. image_to_video animates the
            first; slideshow uses all of them in order.
        aspectRatio:
          type: string
          enum: ["16:9", "9:16", "1:1"]
          default: "9:16"
        durationSec:
          type: integer
          minimum: 3
          maximum: 30
          default: 5
          description: AI engines only; providers clamp to what they support.
        shotCount:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
          description: >-
            text_to_video only; how many shots the brief is split into. Each
            shot is its own AI clip and they are joined into one video, so this
            is also what the job costs in video units. It is fixed here at
            enqueue time — the storyboard editor rewords shots but never adds
            or removes one.
        slideDurationSec:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Slideshow only; seconds each photo is on screen.
        overlayText:
          type: ["string", "null"]
          maxLength: 120
          description: Slideshow only; caption burned into the video.
        musicPath:
          type: ["string", "null"]
          description: >-
            Slideshow and topic_to_video; /objects/... path of an uploaded
            music track, faded out at the end of the video.
        musicPrompt:
          type: ["string", "null"]
          maxLength: 200
          description: >-
            Slideshow and topic_to_video; describe a mood/style and an AI
            music bed is composed for the video (+1 video unit). Ignored
            when musicPath is set.
        voice:
          type: string
          enum: [alloy, echo, fable, onyx, nova, shimmer]
          default: alloy
          description: topic_to_video only; the narration voice.
        stockSource:
          type: string
          enum: [auto, pexels, pixabay, wikimedia]
          default: auto
          description: >-
            topic_to_video only; where stock footage comes from (auto = healthiest
            configured library, with the keyless public-domain archive behind it).
        subtitles:
          type: boolean
          default: true
          description: topic_to_video only; burn per-sentence subtitles.
        captionStyle:
          type: string
          enum: [classic, dynamic]
          default: classic
          description: >-
            topic_to_video only; how burned subtitles look. "classic" shows
            one sentence at a time near the bottom. "dynamic" shows big 2-3
            word groups timed to the narration (the short-form social style).
        paragraphCount:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
          description: >-
            topic_to_video only; script length in paragraphs (roughly 30
            seconds of narration each).
        visualsSource:
          type: string
          enum: [stock, character, ai]
          default: stock
          description: >-
            topic_to_video only. "character" generates every scene with the
            locked character (one video unit per scene, 4 per paragraph).
            "ai" generates owned b-roll imagery per scene with a Ken Burns
            move — no stock licensing — at 2 units per paragraph.
        characterId:
          type: ["integer", "null"]
          description: >-
            Character lock: the character featured in the video
            (text_to_video and topic_to_video character mode).
        outfitId:
          type: ["integer", "null"]
          description: >-
            Costume lock: the outfit the character wears. Defaults to the
            character's default outfit.
        brandKitId:
          type: ["integer", "null"]
          description: >-
            topic_to_video only; apply this brand kit — its voice steers the
            script, its primary color tints the caption stroke, and its logo
            is watermarked top-right.
        styleProfileId:
          type: ["integer", "null"]
          description: >-
            topic_to_video only; write and cut the video like the reference
            video this saved style profile was analyzed from (hook shape,
            pacing, caption treatment).
        wardrobeNotes:
          type: ["string", "null"]
          maxLength: 500
          description: >-
            topic_to_video character mode; costume-change instructions
            (e.g. "switch to gym wear for the workout scenes").
        reviewStoryboard:
          type: boolean
          default: true
          description: >-
            Pause after planning so the storyboard can be edited before the
            expensive half runs. Honoured by every engine except
            topic_to_video's stock branch, whose visuals are searched rather
            than prompted. The job lands in awaiting_review with a storyboard;
            PATCH the scenes, then POST .../storyboard/approve to render it.
    VideoStoryboardScene:
      type: object
      required: [id, text, visual, durationSec, previewPath, outfitId]
      properties:
        id:
          type: string
          description: Stable scene address for edits ("s1", "s2", ...).
        text:
          type: string
          description: >-
            The narration this scene plays under. Read-only: it comes from
            audio that has already been recorded. Empty on the engines that
            voice no script.
        visual:
          type: string
          description: >-
            What this beat shows, and the field you edit. A generation prompt on
            every plan except "slide", where it is the caption burned over that
            photo (empty for no caption).
        durationSec:
          type: number
          description: >-
            Seconds on screen. Read-only while the parent storyboard is
            timelineLocked; otherwise editable within the plan's durationBounds.
        previewPath:
          type: ["string", "null"]
          description: >-
            /objects/... preview still; serve via /api/storage{previewPath}.
            Null when the preview failed to store, and on "prompt" plans, which
            generate no still at all. On "photo" and "slide" plans this is the
            user's own uploaded photo.
        outfitId:
          type: ["integer", "null"]
          description: Character mode; the outfit worn in this scene.
    VideoStoryboard:
      type: object
      required:
        [version, visualsSource, timelineLocked, regenerations, narration, scenes]
      properties:
        version:
          type: integer
          enum: [1]
        visualsSource:
          type: string
          enum: [character, ai, prompt, photo, slide]
          description: >-
            Which pipeline renders these scenes, and therefore what is editable.
            "character" animates a generated keyframe per scene and "ai" encodes
            a generated still per scene — both have re-rollable previews.
            "prompt" is a text_to_video shot list with no stills. "photo" and
            "slide" show the user's own uploaded photos, so their previews cost
            nothing and cannot be re-rolled.
        timelineLocked:
          type: boolean
          description: >-
            True when scene lengths are dictated by narration that has already
            been recorded, which makes durationSec read-only — editing one
            would desync every later scene from the audio.
        durationBounds:
          type: ["object", "null"]
          required: [minSec, maxSec]
          description: >-
            The range a scene length may be edited into. Null when the timeline
            is locked, and on plans stored before lengths were editable.
          properties:
            minSec:
              type: number
            maxSec:
              type: number
        model:
          type: ["string", "null"]
        provider:
          type: ["string", "null"]
        regenerations:
          type: integer
          description: Preview regenerations spent so far; capped server-side.
        narration:
          type: ["object", "null"]
          required: [audioPath, totalDurationSec, cues]
          description: >-
            The recording the scenes are cut against. Null on the engines that
            voice no script, which is also what frees their timeline.
          properties:
            audioPath:
              type: string
            totalDurationSec:
              type: number
            cues:
              type: array
              description: >-
                Subtitle timings measured from the recording, so the render half
                does not have to re-voice the script to know them.
              items:
                type: object
                required: [text, startSec, endSec]
                properties:
                  text:
                    type: string
                  startSec:
                    type: number
                  endSec:
                    type: number
        scenes:
          type: array
          items:
            $ref: "#/components/schemas/VideoStoryboardScene"
    UpdateStoryboardRequest:
      type: object
      required: [scenes]
      properties:
        scenes:
          type: array
          minItems: 1
          maxItems: 24
          description: >-
            Scenes to edit, addressed by id. Only the fields you send change;
            unlisted scenes are untouched. Never accepts image paths — a
            preview is replaced by regenerating it, not by pointing at a file.
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              visual:
                type: string
                maxLength: 1000
                description: >-
                  The prompt for this scene, or its caption on a "slide" plan —
                  where an empty string is meaningful and clears the caption.
                  On every other plan an empty value leaves the prompt alone,
                  because a scene with no prompt has nothing to generate.
              durationSec:
                type: number
                minimum: 1
                maximum: 20
                description: >-
                  Rejected while the storyboard is timelineLocked, and clamped
                  into the plan's durationBounds otherwise.
    VideoJob:
      type: object
      required:
        [id, engine, status, sourceImagePaths, aspectRatio, createdAt, updatedAt]
      properties:
        id:
          type: integer
        engine:
          type: string
          enum: [text_to_video, image_to_video, slideshow, topic_to_video]
        status:
          type: string
          enum: [queued, processing, awaiting_review, succeeded, failed, cancelled]
          description: >-
            awaiting_review means the job paused with an editable storyboard
            and is waiting on approve or discard; it resumes no other way.
        prompt:
          type: ["string", "null"]
        sourceImagePaths:
          type: array
          items:
            type: string
        aspectRatio:
          type: string
        videoPath:
          type: ["string", "null"]
          description: Set when status is succeeded; serve via /api/storage{videoPath}.
        thumbnailPath:
          type: ["string", "null"]
          description: Poster-frame PNG path (best effort; may be null).
        provider:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
          description: Human-readable failure reason when status is failed.
        stage:
          type: ["string", "null"]
          description: >-
            What the pipeline is doing right now (e.g. "Writing the script",
            "Composing the video"). Only meaningful while status is
            processing; null otherwise.
        durationMs:
          type: ["integer", "null"]
        storyboard:
          oneOf:
            - $ref: "#/components/schemas/VideoStoryboard"
            - type: "null"
          description: >-
            The editable plan. Present while status is awaiting_review, and kept
            afterwards as a record of what was approved.
        storyboardExpiresAt:
          type: ["string", "null"]
          format: date-time
          description: >-
            When an unapproved storyboard is discarded and its reservation
            refunded. Only set while status is awaiting_review.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MusicTrack:
      type: object
      required: [id, title, license, audioUrl]
      properties:
        id:
          type: string
        title:
          type: string
        creator:
          type: ["string", "null"]
        license:
          type: string
          description: License slug (e.g. "by", "by-sa", "cc0").
        licenseUrl:
          type: ["string", "null"]
        durationSec:
          type: ["integer", "null"]
        audioUrl:
          type: string
          description: Direct https audio URL (also usable for preview).
    MusicSearchResults:
      type: object
      required: [tracks]
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/MusicTrack"
    ImportLibraryMusicRequest:
      type: object
      required: [audioUrl, title]
      properties:
        audioUrl:
          type: string
          minLength: 12
          maxLength: 2000
        title:
          type: string
