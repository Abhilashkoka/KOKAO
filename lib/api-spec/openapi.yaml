  /content/{id}/resend-linkedin-comments:
    post:
      operationId: resendLinkedinComments
      tags: [linkedin]
      summary: Resend LinkedIn follow-up comments that failed during a publish
      description: >-
        Posts only the follow-up comments that are still missing from an
        earlier LinkedIn publish, keeping their original "(i/n)" numbering.
        Available only while the content item has an incomplete comment
        sequence recorded.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resend attempt finished (fully or partially)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendLinkedinCommentsResult"
        "400":
          description: Nothing to resend or LinkedIn not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A resend for this content item is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /content/{id}/resend-threads-posts:
    post:
      operationId: resendThreadsPosts
      tags: [threads]
      summary: Resend the Threads follow-up posts that failed during a publish
      description: >-
        Posts only the reply-chain pieces that are still missing from an
        earlier Threads publish, chained onto the last successfully posted
        reply so the thread stays connected and keeps its original order.
        Available only while the content item has an incomplete reply chain
        recorded.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resend attempt finished (fully or partially)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendChainPostsResult"
        "400":
          description: Nothing to resend or Threads not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A resend for this content item is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /content/{id}/resend-twitter-posts:
