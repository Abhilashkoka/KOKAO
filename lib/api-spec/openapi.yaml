        - scheduledAt
        - status
        - retryCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        contentItemId:
          type: integer
        platform:
          type: string
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, processing, published, failed, cancelled]
          description: >-
            pending = waiting for the scheduled time; processing = the
            background publisher is publishing it right now; published =
            automatically published; failed = the automatic publish failed
            (see failureReason); cancelled = called off by the user.
        failureReason:
          type: ["string", "null"]
          description: >-
            Why the automatic publish failed, when status is failed. When
            status is pending and retryCount > 0, holds the transient error
            that triggered the automatic retry.
        retryCount:
          type: integer
          description: >-
            Number of automatic retries after transient platform outages.
            When status is pending and retryCount > 0, the post is
            auto-retrying after a temporary outage.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScheduleInput:
      type: object
      required: [contentItemId, platform, scheduledAt]
      properties:
        contentItemId:
          type: integer
        platform:
          type: string
          minLength: 1
        scheduledAt:
          type: string
          format: date-time
    ScheduleUpdate:
      type: object
      properties:
        platform:
          type: string
          minLength: 1
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, published, failed, cancelled]

