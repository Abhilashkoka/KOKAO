  /admin/audit-logs:
    get:
      operationId: adminListAuditLogs
      tags: [admin]
      summary: List the privileged admin action audit trail (superadmin only)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Page size (max 200).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of records to skip (most recent first).
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                plan_change,
                superadmin_grant,
                superadmin_revoke,
                plan_edit,
                plan_create,
                plan_delete,
                notification_policy_change,
                credential_change,
                app_brand_change,
                email_settings_change,
                email_test_send,
                sweep_run,
              ]
          description: Only return records of this action type.
        - name: actor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: >-
            Case-insensitive substring match on the actor email, or an exact
            actor tenant id when numeric.
        - name: target
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: >-
            Case-insensitive substring match on the target email, or an exact
            target tenant id when numeric.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only return records created at or after this time.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only return records created at or before this time.
      responses:
        "200":
          description: A page of admin audit records, most recent first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogPage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

