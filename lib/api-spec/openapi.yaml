          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadsAuthUrlResult"
        "503":
          description: Threads is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /threads/status:
    get:
      operationId: getThreadsStatus
      tags: [threads]
      summary: Whether a Threads profile is connected
      responses:
        "200":
          description: Threads connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadsStatus"

  /threads:
    delete:
      operationId: disconnectThreads
      tags: [threads]
      summary: Disconnect Threads, clearing the stored OAuth token and profile
      responses:
        "200":
          description: Threads connection status after disconnecting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadsStatus"

  /threads/retest:
    post:
      operationId: retestThreads
      tags: [threads]
      summary: Re-check the stored Threads connection; clears it if no longer valid
      responses:
        "200":
          description: Threads connection status after re-checking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadsStatus"
        "400":
          description: No stored Threads connection to re-test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /content/{id}/publish-threads:
    post:
      operationId: publishContentToThreads
      tags: [threads]
      summary: Publish a content item to the connected Threads profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishThreadsResult"
        "400":
          description: Invalid input or Threads not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Threads API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/platform-credentials/threads:
    get:
      operationId: adminGetThreadsCredentials
      tags: [platform-credentials]
      summary: Get masked app-level Threads OAuth credentials (superadmin only)
      responses:
        "200":
          description: Threads app credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadsAppCredentialStatus"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: adminSaveThreadsCredentials
      tags: [platform-credentials]
      summary: Save app-level Threads OAuth credentials (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadsAppCredentialInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadsAppCredentialStatus"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/platform-credentials/youtube:
    get:
      operationId: adminGetYoutubeCredentials
      tags: [platform-credentials]
      summary: Get masked app-level Google OAuth credentials for YouTube (superadmin only)
      responses:
        "200":
          description: YouTube app credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeAppCredentialStatus"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: adminSaveYoutubeCredentials
      tags: [platform-credentials]
      summary: Save app-level Google OAuth credentials for YouTube (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeAppCredentialInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeAppCredentialStatus"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /twitter/auth/url:
    get:
      operationId: getTwitterAuthUrl
      tags: [twitter]
      summary: Get the X (Twitter) OAuth 2.0 PKCE authorization URL to begin connecting
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwitterAuthUrlResult"
        "503":
          description: X is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /twitter/status:
    get:
      operationId: getTwitterStatus
      tags: [twitter]
      summary: Whether an X (Twitter) account is connected and able to publish
      responses:
        "200":
          description: X connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwitterStatus"

  /twitter:
    delete:
      operationId: disconnectTwitter
      tags: [twitter]
      summary: Disconnect X (Twitter), clearing the stored OAuth token and account
      responses:
        "200":
          description: X connection status after disconnecting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwitterStatus"

  /twitter/retest:
    post:
      operationId: retestTwitterCredentials
      tags: [twitter]
      summary: Re-verify the tenant's stored X (Twitter) connection without reconnecting
      responses:
        "200":
          description: Re-verified X connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwitterStatus"
        "400":
          description: No connected X account or X app not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /content/{id}/publish-twitter:
    post:
      operationId: publishContentToTwitter
      tags: [twitter]
      summary: Publish a content item to the tenant's connected X (Twitter) account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishTwitterResult"
        "400":
          description: X not connected or not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: X API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Tenant:
      type: object
      required: [id, name, plan, aiModel, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        plan:
          type: string
        aiModel:
          type: string
        industry:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    TenantSettings:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        plan:
          type: string
        aiModel:
          type: string
          minLength: 1
        industry:
          type: ["string", "null"]
    Usage:
      type: object
      required: [captions, images, periodStart]
      properties:
        captions:
          type: integer
        images:
          type: integer
        periodStart:
          type: string
          format: date-time
    PlanLimits:
      type: object
      required: [captions, images, brandKits, scheduledPosts]
      properties:
        captions:
          type: integer
          description: Monthly caption generation limit. -1 means unlimited.
        images:
          type: integer
          description: Monthly image generation limit. -1 means unlimited.
        brandKits:
          type: integer
          description: Max brand kits. -1 means unlimited.
        scheduledPosts:
          type: integer
          description: Max scheduled posts. -1 means unlimited.
    MeProfile:
      type: object
      required:
        [tenant, usage, limits, isSuperadmin, isOwner, brandOnboardingComplete]
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        usage:
          $ref: "#/components/schemas/Usage"
        limits:
          $ref: "#/components/schemas/PlanLimits"
        isSuperadmin:
          type: boolean
          description: Whether the current user has cross-tenant superadmin access.
        isOwner:
          type: boolean
          description: >-
            Whether the current user is an allowlisted (root) owner. Only owners
            may grant or revoke the superadmin role for other tenants.
        brandOnboardingComplete:
          type: boolean
          description: Whether the tenant has finished (or skipped) brand onboarding.
    AppBrand:
      type: object
      required:
        [appName, logoUrl, iconUrl, primaryColor, backgroundColor]
      properties:
        appName:
          type: ["string", "null"]
          description: Overrides the app name in the title and alt text.
        logoUrl:
          type: ["string", "null"]
          description: Public served path of the logo shown in nav and landing.
        iconUrl:
          type: ["string", "null"]
          description: Public served path of the favicon / app icon.
        primaryColor:
          type: ["string", "null"]
          description: Hex primary/accent color applied to the theme.
        backgroundColor:
          type: ["string", "null"]
          description: Hex app background color applied to the theme.
    AppBrandInput:
      type: object
      properties:
        appName:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        iconUrl:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        backgroundColor:
          type: ["string", "null"]
    AppBrandUploadUrlBody:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          description: MIME type of the asset to upload (e.g. image/png).
    AppBrandUploadUrlResponse:
      type: object
      required: [uploadURL, servedPath]
      properties:
        uploadURL:
          type: string
          description: Presigned URL to PUT the file bytes to.
        servedPath:
          type: string
          description: Browser-facing path where the uploaded asset will be served.
    Plan:
      type: object
      required: [id, name, priceLabel, limits, features]
      properties:
        id:
          type: string
        name:
          type: string
        priceLabel:
          type: string
        limits:
          $ref: "#/components/schemas/PlanLimits"
        features:
          type: array
          items:
            type: string

    PlanCreateInput:
      type: object
      required: [name, priceLabel, limits, features]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^[a-z0-9][a-z0-9-]*$"
          description: >-
            Optional url-safe id (lowercase letters, digits, dashes). Derived
            from the name when omitted.
        name:
          type: string
          minLength: 1
          maxLength: 60
        priceLabel:
          type: string
          minLength: 1
          maxLength: 40
        limits:
          $ref: "#/components/schemas/PlanLimits"
        features:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 120
    PlanUpdateInput:
      type: object
      required: [name, priceLabel, limits, features]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        priceLabel:
          type: string
          minLength: 1
          maxLength: 40
        limits:
          $ref: "#/components/schemas/PlanLimits"
        features:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 120
    AdminTenantCounts:
      type: object
      required: [content, brandKits, scheduledPosts, connectedAccounts]
      properties:
        content:
          type: integer
        brandKits:
          type: integer
        scheduledPosts:
          type: integer
        connectedAccounts:
          type: integer
    AdminTenant:
      type: object
      required:
        [id, email, name, plan, aiModel, isSuperadmin, isAllowlisted, createdAt]
      properties:
        id:
          type: integer
        email:
          type: ["string", "null"]
        name:
          type: string
        plan:
          type: string
        aiModel:
          type: string
        isSuperadmin:
          type: boolean
          description: Effective superadmin status (granted in-app or allowlisted).
        isAllowlisted:
          type: boolean
          description: >-
            Built-in/env allowlisted superadmin. Locked: cannot be revoked
            in-app.
        createdAt:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/AdminTenantCounts"
        usage:
          $ref: "#/components/schemas/Usage"
    AdminStats:
      type: object
      required:
        - totalTenants
        - tenantsByPlan
        - totalContent
        - totalScheduledPosts
        - totalConnectedAccounts
      properties:
        totalTenants:
          type: integer
        tenantsByPlan:
          type: object
          additionalProperties:
            type: integer
        totalContent:
          type: integer
        totalScheduledPosts:
          type: integer
        totalConnectedAccounts:
          type: integer
    UpdateTenantPlanBody:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          minLength: 1
          maxLength: 40
    UpdateTenantSuperadminBody:
      type: object
      required: [isSuperadmin]
      properties:
        isSuperadmin:
          type: boolean

    AdminAuditLog:
      type: object
      required:
        [
          id,
          action,
          actorTenantId,
          targetTenantId,
          createdAt,
        ]
      properties:
        id:
          type: integer
        action:
          type: string
          enum:
            [
              plan_change,
              superadmin_grant,
              superadmin_revoke,
              plan_edit,
              plan_create,
              plan_delete,
            ]
          description: The privileged action that was recorded.
        actorTenantId:
          type: integer
          description: Tenant id of the superadmin who performed the action.
        actorEmail:
          type: ["string", "null"]
          description: Cached email of the actor at the time of the action.
        targetTenantId:
          type: ["integer", "null"]
          description: >-
            Tenant id whose plan or role was changed. Null for platform-wide
            actions such as plan edits.
        targetEmail:
          type: ["string", "null"]
          description: Cached email of the target tenant.
        oldValue:
          type: ["string", "null"]
          description: Previous value (plan name or superadmin boolean string).
        newValue:
          type: ["string", "null"]
          description: New value (plan name or superadmin boolean string).
        createdAt:
          type: string
          format: date-time

    NotificationChannelPreference:
      type: object
      required: [inApp, email]
      properties:
        inApp:
          type: boolean
        email:
          type: boolean
    NotificationTypeSetting:
      type: object
      required:
        [type, label, description, enabled, emailPolicy, preference, effective]
      properties:
        type:
          type: string
        label:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          description: Whether this notification type is enabled platform-wide.
        emailPolicy:
          type: string
          enum: [optional, forced, off]
          description: >-
            How the email channel is offered: "optional" lets the tenant choose,
            "forced" always emails, "off" never emails.
        preference:
          $ref: "#/components/schemas/NotificationChannelPreference"
        effective:
          $ref: "#/components/schemas/NotificationChannelPreference"
    NotificationSettings:
      type: object
      required: [emailConfigured, types]
      properties:
        emailConfigured:
          type: boolean
          description: Whether email delivery is currently connected and will send.
        types:
          type: array
          items:
            $ref: "#/components/schemas/NotificationTypeSetting"
    UpdateNotificationPreferenceItem:
      type: object
      required: [type, inApp, email]
      properties:
        type:
          type: string
        inApp:
          type: boolean
        email:
          type: boolean
    NotificationSettingsInput:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/UpdateNotificationPreferenceItem"
    NotificationPolicy:
      type: object
      required: [type, label, description, enabled, emailPolicy]
      properties:
        type:
          type: string
        label:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        emailPolicy:
          type: string
          enum: [optional, forced, off]
    UpdateNotificationPolicyItem:
      type: object
      required: [type, enabled, emailPolicy]
      properties:
        type:
          type: string
        enabled:
          type: boolean
        emailPolicy:
          type: string
          enum: [optional, forced, off]
    UpdateNotificationPoliciesBody:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/UpdateNotificationPolicyItem"

    BrandColor:
      type: object
      required: [name, hex, usage]
      properties:
        name: { type: string }
        hex: { type: string }
        usage: { type: string }
    BrandLogoRef:
      type: object
      required: [url, type]
      properties:
        url: { type: string }
        type: { type: string }
    BrandChannelRule:
      type: object
      required: [formats, notes]
      properties:
        formats:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }
    BrandKitPayload:
      type: object
      description: Source-of-truth brand definition stored immutably per version.
      required:
        - identity
        - logos
        - colors
        - typography
        - voice
        - visual_style
        - layout_tokens
        - channel_rules
        - brand_controls
      properties:
        identity:
          type: object
          required:
            [brand_name, brand_slug, tagline, description, industry, audience]
          properties:
            brand_name: { type: string }
            brand_slug: { type: string }
            tagline: { type: string }
            description: { type: string }
            industry: { type: string }
            audience:
              type: array
              items: { type: string }
        logos:
          type: object
          required: [primary, secondary, icon_mark, favicon, usage_rules]
          properties:
            primary:
              oneOf:
                - $ref: "#/components/schemas/BrandLogoRef"
                - type: "null"
            secondary:
              oneOf:
                - $ref: "#/components/schemas/BrandLogoRef"
                - type: "null"
            icon_mark:
              oneOf:
                - $ref: "#/components/schemas/BrandLogoRef"
                - type: "null"
            favicon:
              oneOf:
                - $ref: "#/components/schemas/BrandLogoRef"
                - type: "null"
            usage_rules:
              type: array
              items: { type: string }
        colors:
          type: object
          required: [primary, secondary, neutral, semantic]
          properties:
            primary:
              type: array
              items: { $ref: "#/components/schemas/BrandColor" }
            secondary:
              type: array
              items: { $ref: "#/components/schemas/BrandColor" }
            neutral:
              type: array
              items: { $ref: "#/components/schemas/BrandColor" }
            semantic:
              type: array
              items: { $ref: "#/components/schemas/BrandColor" }
        typography:
          type: object
          required: [heading_font, body_font, fallback_fonts, scale, weights]
          properties:
            heading_font: { type: string }
            body_font: { type: string }
            fallback_fonts:
              type: array
              items: { type: string }
            scale:
              type: object
              required: [h1, h2, h3, h4, body, small, caption]
              properties:
                h1: { type: string }
                h2: { type: string }
                h3: { type: string }
                h4: { type: string }
                body: { type: string }
                small: { type: string }
                caption: { type: string }
            weights:
              type: object
              required: [regular, medium, semibold, bold]
              properties:
                regular: { type: integer }
                medium: { type: integer }
                semibold: { type: integer }
                bold: { type: integer }
        voice:
          type: object
          required: [traits, dos, donts, caption_style, cta_style]
          properties:
            traits:
              type: array
              items: { type: string }
            dos:
              type: array
              items: { type: string }
            donts:
              type: array
              items: { type: string }
            caption_style: { type: string }
            cta_style: { type: string }
        visual_style:
          type: object
          required: [imagery_style, icon_style, illustration_style, motion_style]
          properties:
            imagery_style:
              type: array
              items: { type: string }
            icon_style: { type: string }
            illustration_style: { type: string }
            motion_style: { type: string }
        layout_tokens:
          type: object
          required: [base_unit, radius, shadow]
          properties:
            base_unit: { type: string }
            radius:
              type: object
              required: [sm, md, lg]
              properties:
                sm: { type: string }
                md: { type: string }
                lg: { type: string }
            shadow:
              type: object
              required: [sm, md, lg]
              properties:
                sm: { type: string }
                md: { type: string }
                lg: { type: string }
        channel_rules:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BrandChannelRule"
        brand_controls:
          type: object
          required:
            [approved, approval_status, allowed_use_cases, restricted_terms]
          properties:
            approved: { type: boolean }
            approval_status:
              type: string
              enum: [draft, approved, archived]
            allowed_use_cases:
              type: array
              items: { type: string }
            restricted_terms:
              type: array
              items: { type: string }
    BrandKitVersion:
      type: object
