components:
  parameters:
    AnalyticsFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Start of the reporting window (defaults to 30 days ago).
    AnalyticsTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: End of the reporting window (defaults to now).
    AnalyticsTenantId:
      name: tenantId
      in: query
      required: false
      schema:
        type: integer
      description: Superadmin-only per-tenant drilldown; ignored otherwise.
    AdsConnectionId:
      name: connectionId
      in: query
      required: true
      schema:
        type: integer
      description: The ad account connection to read from.
    AdsDatePreset:
      name: datePreset
      in: query
      required: false
      schema:
        type: string
        enum: [today, yesterday, last_7d, last_14d, last_30d, last_90d, maximum]
      description: Reporting date range (defaults to last_30d).
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: >-
            Optional machine-readable error code. Currently
            "already_complete" on resend endpoints when there is nothing left
            to resend (e.g. a concurrent resend already posted everything).

    Tenant:
      type: object
      required: [id, name, plan, aiModel, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        plan:
          type: string
        aiModel:
          type: string
        industry:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    TenantSettings:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        plan:
          type: string
        aiModel:
          type: string
          minLength: 1
        industry:
          type: ["string", "null"]
    Usage:
      type: object
      required: [captions, images, periodStart]
      properties:
        captions:
          type: integer
        images:
          type: integer
        periodStart:
          type: string
          format: date-time
    PlanLimits:
      type: object
      required: [captions, images, brandKits, scheduledPosts]
      properties:
        captions:
          type: integer
          description: Monthly caption generation limit. -1 means unlimited.
        images:
          type: integer
          description: Monthly image generation limit. -1 means unlimited.
        brandKits:
          type: integer
          description: Max brand kits. -1 means unlimited.
        scheduledPosts:
          type: integer
          description: Max scheduled posts. -1 means unlimited.
    MeProfile:
      type: object
      required:
        [tenant, usage, limits, isSuperadmin, isOwner, brandOnboardingComplete]
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        usage:
          $ref: "#/components/schemas/Usage"
        limits:
          $ref: "#/components/schemas/PlanLimits"
        credits:
          $ref: "#/components/schemas/CreditBalances"
          description: >-
            Prepaid credit balances. Credits are consumed automatically when
            the monthly plan quota is exhausted.
        isSuperadmin:
          type: boolean
          description: Whether the current user has cross-tenant superadmin access.
        isOwner:
          type: boolean
          description: >-
            Whether the current user is an allowlisted (root) owner. Only owners
            may grant or revoke the superadmin role for other tenants.
        brandOnboardingComplete:
          type: boolean
          description: Whether the tenant has finished (or skipped) brand onboarding.
        team:
          $ref: "#/components/schemas/TeamStatus"
        pendingInvite:
          anyOf:
            - $ref: "#/components/schemas/PendingInviteHint"
            - type: "null"
          description: >-
            For workspace owners only: a pending team invite sent to one of
            their verified emails for ANOTHER workspace (null when none).
            Invites only auto-accept on first sign-in with the invited
            address, so this lets the UI point the user at the right email.
    PendingInviteHint:
      type: object
      required: [email, workspaceName]
      properties:
        email:
          type: string
          description: The exact email address the invite was sent to.
        workspaceName:
          type: string
          description: Name of the workspace the invite is for.
    TeamStatus:
      type: object
      required: [enabled, role, seatLimit, workspaceName]
      properties:
        enabled:
          type: boolean
          description: >-
            Whether the team add-on is active for this workspace (the plan
            includes team seats or a superadmin granted a seat override).
        role:
          type: string
          enum: [owner, admin, member]
          description: The current user's role in this workspace.
        seatLimit:
          type: integer
          description: Effective seat limit (workspace override or plan default).
        workspaceName:
          type: string
          description: Name of the workspace the current user is working in.
        invitedByEmail:
          type: ["string", "null"]
          description: >-
            For invited members/admins, the email of the person who invited
            them (null when unknown). Always null for the owner.
        joinedAt:
          type: ["string", "null"]
          format: date-time
          description: When the current user joined this workspace (members only).
    LeaveTeamResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    TeamMember:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [owner, admin, member]
        createdAt:
          type: string
          format: date-time
    TeamInvite:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [pending, accepted, revoked]
        createdAt:
          type: string
          format: date-time
    SeatRequest:
      type: object
      required: [id, requestedSeats, note, status, grantedSeats, createdAt]
      properties:
        id:
          type: integer
        requestedSeats:
