openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SocialForge API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: account
    description: Current tenant profile, settings, usage, and plans.
  - name: brand-kits
    description: Brand kit management.
  - name: content
    description: Content library items.
  - name: ai
    description: AI caption and image generation.
  - name: schedules
    description: Scheduled posts queue.
  - name: accounts
    description: Connected social accounts.
  - name: admin
    description: Cross-tenant superadmin operations.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get current tenant profile, usage, and plan limits
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/settings:
    patch:
      operationId: updateSettings
      tags: [account]
      summary: Update tenant settings (name, plan, AI model)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSettings"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /plans:
    get:
      operationId: listPlans
      tags: [account]
      summary: List available subscription plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /admin/tenants:
    get:
      operationId: adminListTenants
      tags: [admin]
      summary: List all tenants with usage and resource counts (superadmin only)
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTenant"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/tenants/{id}:
    patch:
      operationId: adminUpdateTenantPlan
      tags: [admin]
      summary: Update a tenant's subscription plan (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantPlanBody"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/tenants/{id}/superadmin:
    patch:
      operationId: adminUpdateTenantSuperadmin
      tags: [admin]
      summary: Grant or revoke a tenant's superadmin role (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantSuperadminBody"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Platform-wide aggregate stats (superadmin only)
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /brand-kits:
    get:
      operationId: listBrandKits
      tags: [brand-kits]
      summary: List brand kits
      responses:
        "200":
          description: List of brand kits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandKit"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createBrandKit
      tags: [brand-kits]
      summary: Create a brand kit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandKitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /brand-kits/{id}:
    get:
      operationId: getBrandKit
      tags: [brand-kits]
      summary: Get a brand kit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateBrandKit
      tags: [brand-kits]
      summary: Update a brand kit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandKitUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteBrandKit
      tags: [brand-kits]
      summary: Delete a brand kit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /content:
    get:
      operationId: listContent
      tags: [content]
      summary: List content items
      responses:
        "200":
          description: List of content items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createContent
      tags: [content]
      summary: Create a content item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /content/{id}:
    get:
      operationId: getContent
      tags: [content]
      summary: Get a content item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Content item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateContent
      tags: [content]
      summary: Update a content item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteContent
      tags: [content]
      summary: Delete a content item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /ai/generate-caption:
    post:
      operationId: generateCaption
      tags: [ai]
      summary: Generate an AI caption with hashtags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptionRequest"
      responses:
        "200":
          description: Generated caption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionResult"
        "402":
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ai/generate-image:
    post:
      operationId: generateImage
      tags: [ai]
      summary: Generate an AI image and persist it to storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRequest"
      responses:
        "200":
          description: Generated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResult"
        "402":
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ai/suggest-topics:
    post:
      operationId: suggestTopics
      tags: [ai]
      summary: Suggest trending post topic ideas for a niche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicIdeasRequest"
      responses:
        "200":
          description: Topic ideas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicIdeasResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ai/summarize-url:
    post:
      operationId: summarizeUrl
      tags: [ai]
      summary: Fetch an article URL and summarize it into a title and summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizeUrlRequest"
      responses:
        "200":
          description: Article summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummarizeUrlResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Could not fetch or parse the URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ai/generate-campaign:
    post:
      operationId: generateCampaign
      tags: [ai]
      summary: Generate tailored captions and image prompts for multiple platforms in one run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRequest"
      responses:
        "200":
          description: Generated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResult"
        "402":
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List scheduled posts
      responses:
        "200":
          description: List of scheduled posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledPost"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Schedule a content item for publishing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPost"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /schedules/{id}:
    patch:
      operationId: updateSchedule
      tags: [schedules]
      summary: Update a scheduled post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Cancel a scheduled post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List connected social accounts
      responses:
        "200":
          description: List of connected accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectedAccount"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Connect a social account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccount"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /accounts/{id}:
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Disconnect a social account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/platform-credentials/meta:
    get:
      operationId: adminGetMetaCredentials
      tags: [platform-credentials]
      summary: Get masked app-level Meta credentials and test status (superadmin only)
      responses:
        "200":
          description: Meta app credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAppCredentialStatus"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: adminSaveMetaCredentials
      tags: [platform-credentials]
      summary: Save and auto-test app-level Meta credentials (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaAppCredentialInput"
      responses:
        "200":
          description: Saved and tested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAppCredentialStatus"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /social-credentials/facebook:
    get:
      operationId: getFacebookCredentials
      tags: [social-credentials]
      summary: Get the tenant's masked Facebook credentials and verify status
      responses:
        "200":
          description: Facebook credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCredentialStatus"
    put:
      operationId: saveFacebookCredentials
      tags: [social-credentials]
      summary: Save and auto-verify the tenant's Facebook Page credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacebookCredentialInput"
      responses:
        "200":
          description: Saved and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCredentialStatus"
        "400":
          description: Invalid input or Meta app not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: disconnectFacebook
      tags: [social-credentials]
      summary: Clear the tenant's stored Facebook credentials and verify status
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCredentialStatus"

  /social-credentials/facebook/retest:
    post:
      operationId: retestFacebookCredentials
      tags: [social-credentials]
      summary: Re-verify the tenant's stored Facebook credentials without re-entering them
      responses:
        "200":
          description: Re-verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCredentialStatus"
        "400":
          description: No stored credentials or Meta app not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /social-credentials/instagram:
    get:
      operationId: getInstagramCredentials
      tags: [social-credentials]
      summary: Get the tenant's masked Instagram credentials and verify status
      responses:
        "200":
          description: Instagram credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCredentialStatus"
    put:
      operationId: saveInstagramCredentials
      tags: [social-credentials]
      summary: Save and auto-verify the tenant's Instagram Business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstagramCredentialInput"
      responses:
        "200":
          description: Saved and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCredentialStatus"
        "400":
          description: Invalid input, Meta app not configured, or Facebook not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: disconnectInstagram
      tags: [social-credentials]
      summary: Clear the tenant's stored Instagram credentials and verify status
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCredentialStatus"

  /social-credentials/instagram/retest:
    post:
      operationId: retestInstagramCredentials
      tags: [social-credentials]
      summary: Re-verify the tenant's stored Instagram account without re-entering it
      responses:
        "200":
          description: Re-verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCredentialStatus"
        "400":
          description: No stored credentials, Meta app not configured, or Facebook not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /content/{id}/publish-facebook:
    post:
      operationId: publishContentToFacebook
      tags: [facebook]
      summary: Publish a content item to the tenant's connected Facebook Page
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishFacebookResult"
        "400":
          description: Facebook not connected or not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Facebook API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /content/{id}/publish-instagram:
    post:
      operationId: publishContentToInstagram
      tags: [instagram]
      summary: Publish a content item to the tenant's connected Instagram account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishInstagramResult"
        "400":
          description: Instagram not connected, not verified, or missing image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Instagram API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /linkedin/auth/url:
    get:
      operationId: getLinkedinAuthUrl
      tags: [linkedin]
      summary: Get the LinkedIn OAuth authorization URL to begin connecting
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedInAuthUrlResult"
        "503":
          description: LinkedIn is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /linkedin/status:
    get:
      operationId: getLinkedinStatus
      tags: [linkedin]
      summary: Whether a LinkedIn account is connected and able to publish
      responses:
        "200":
          description: LinkedIn connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedInStatus"

  /linkedin:
    delete:
      operationId: disconnectLinkedin
      tags: [linkedin]
      summary: Disconnect LinkedIn, clearing the stored OAuth token and account
      responses:
        "200":
          description: LinkedIn connection status after disconnecting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedInStatus"

  /linkedin/retest:
    post:
      operationId: retestLinkedin
      tags: [linkedin]
      summary: Re-check the stored LinkedIn token; clears it if no longer valid
      responses:
        "200":
          description: LinkedIn connection status after re-checking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedInStatus"
        "400":
          description: No stored LinkedIn connection to re-test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /content/{id}/publish-linkedin:
    post:
      operationId: publishContentToLinkedin
      tags: [linkedin]
      summary: Publish a content item to the connected LinkedIn member feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishLinkedInResult"
        "400":
          description: Invalid input or LinkedIn not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: LinkedIn API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/platform-credentials/twitter:
    get:
      operationId: adminGetTwitterCredentials
      tags: [platform-credentials]
      summary: Get masked app-level X (Twitter) credentials and test status (superadmin only)
      responses:
        "200":
          description: X app credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwitterAppCredentialStatus"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: adminSaveTwitterCredentials
      tags: [platform-credentials]
      summary: Save and auto-test app-level X (Twitter) credentials (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwitterAppCredentialInput"
      responses:
        "200":
          description: Saved and tested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwitterAppCredentialStatus"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /social-credentials/twitter:
    get:
      operationId: getTwitterCredentials
      tags: [social-credentials]
      summary: Get the tenant's masked X (Twitter) credentials and verify status
      responses:
        "200":
          description: X credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCredentialStatus"
    put:
      operationId: saveTwitterCredentials
      tags: [social-credentials]
      summary: Save and auto-verify the tenant's X (Twitter) access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwitterCredentialInput"
      responses:
        "200":
          description: Saved and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCredentialStatus"
        "400":
          description: Invalid input or X app not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /content/{id}/publish-twitter:
    post:
      operationId: publishContentToTwitter
      tags: [twitter]
      summary: Publish a content item to the tenant's connected X (Twitter) account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishTwitterResult"
        "400":
          description: X not connected or not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: X API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Tenant:
      type: object
      required: [id, name, plan, aiModel, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        plan:
          type: string
        aiModel:
          type: string
        createdAt:
          type: string
          format: date-time
    TenantSettings:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        plan:
          type: string
          enum: [free, pro, business]
        aiModel:
          type: string
          minLength: 1
    Usage:
      type: object
      required: [captions, images, periodStart]
      properties:
        captions:
          type: integer
        images:
          type: integer
        periodStart:
          type: string
          format: date-time
    PlanLimits:
      type: object
      required: [captions, images, brandKits, scheduledPosts]
      properties:
        captions:
          type: integer
          description: Monthly caption generation limit. -1 means unlimited.
        images:
          type: integer
          description: Monthly image generation limit. -1 means unlimited.
        brandKits:
          type: integer
          description: Max brand kits. -1 means unlimited.
        scheduledPosts:
          type: integer
          description: Max scheduled posts. -1 means unlimited.
    MeProfile:
      type: object
      required: [tenant, usage, limits, isSuperadmin, isOwner]
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        usage:
          $ref: "#/components/schemas/Usage"
        limits:
          $ref: "#/components/schemas/PlanLimits"
        isSuperadmin:
          type: boolean
          description: Whether the current user has cross-tenant superadmin access.
        isOwner:
          type: boolean
          description: >-
            Whether the current user is an allowlisted (root) owner. Only owners
            may grant or revoke the superadmin role for other tenants.
    Plan:
      type: object
      required: [id, name, priceLabel, limits, features]
      properties:
        id:
          type: string
        name:
          type: string
        priceLabel:
          type: string
        limits:
          $ref: "#/components/schemas/PlanLimits"
        features:
          type: array
          items:
            type: string

    AdminTenantCounts:
      type: object
      required: [content, brandKits, scheduledPosts, connectedAccounts]
      properties:
        content:
          type: integer
        brandKits:
          type: integer
        scheduledPosts:
          type: integer
        connectedAccounts:
          type: integer
    AdminTenant:
      type: object
      required:
        [id, email, name, plan, aiModel, isSuperadmin, isAllowlisted, createdAt]
      properties:
        id:
          type: integer
        email:
          type: ["string", "null"]
        name:
          type: string
        plan:
          type: string
        aiModel:
          type: string
        isSuperadmin:
          type: boolean
          description: Effective superadmin status (granted in-app or allowlisted).
        isAllowlisted:
          type: boolean
          description: >-
            Built-in/env allowlisted superadmin. Locked: cannot be revoked
            in-app.
        createdAt:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/AdminTenantCounts"
        usage:
          $ref: "#/components/schemas/Usage"
    AdminStats:
      type: object
      required:
        - totalTenants
        - tenantsByPlan
        - totalContent
        - totalScheduledPosts
        - totalConnectedAccounts
      properties:
        totalTenants:
          type: integer
        tenantsByPlan:
          type: object
          required: [free, pro, business]
          properties:
            free:
              type: integer
            pro:
              type: integer
            business:
              type: integer
        totalContent:
          type: integer
        totalScheduledPosts:
          type: integer
        totalConnectedAccounts:
          type: integer
    UpdateTenantPlanBody:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [free, pro, business]
    UpdateTenantSuperadminBody:
      type: object
      required: [isSuperadmin]
      properties:
        isSuperadmin:
          type: boolean

    BrandKit:
      type: object
      required:
        - id
        - name
        - primaryColor
        - secondaryColor
        - accentColor
        - voice
        - hashtags
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        voice:
          type: string
        hashtags:
          type: array
          items:
            type: string
        logoPath:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BrandKitInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        voice:
          type: string
        hashtags:
          type: array
          items:
            type: string
        logoPath:
          type: ["string", "null"]
    BrandKitUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        voice:
          type: string
        hashtags:
          type: array
          items:
            type: string
        logoPath:
          type: ["string", "null"]

    MetaAppCredentialInput:
      type: object
      required: [appId, appSecret]
      properties:
        appId:
          type: string
          minLength: 1
        appSecret:
          type: string
          minLength: 1
    MetaAppCredentialStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether Meta app keys have been saved.
        appIdMasked:
          type: ["string", "null"]
        appSecretMasked:
          type: ["string", "null"]
        testStatus:
          type: ["string", "null"]
          description: '"verified" or "failed" from the last automatic test.'
        testedAt:
          type: ["string", "null"]
          format: date-time
        testError:
          type: ["string", "null"]
    FacebookCredentialInput:
      type: object
      required: [pageId, pageAccessToken]
      properties:
        pageId:
          type: string
          minLength: 1
        pageAccessToken:
          type: string
          minLength: 1
    InstagramCredentialInput:
      type: object
      required: [igUserId]
      properties:
        igUserId:
          type: string
          minLength: 1
    SocialCredentialStatus:
      type: object
      required: [platform, appConfigured, saved]
      properties:
        platform:
          type: string
        appConfigured:
          type: boolean
          description: Whether the admin-level Meta app keys are configured.
        saved:
          type: boolean
          description: Whether the tenant has saved credentials for this platform.
        verifyStatus:
          type: ["string", "null"]
          description: '"verified" or "failed" from the last automatic verification.'
        verifiedAt:
          type: ["string", "null"]
          format: date-time
        verifyError:
          type: ["string", "null"]
        accountName:
          type: ["string", "null"]
        pageId:
          type: ["string", "null"]
        pageAccessTokenMasked:
          type: ["string", "null"]
        igUserId:
          type: ["string", "null"]
        accessTokenMasked:
          type: ["string", "null"]
    PublishFacebookResult:
      type: object
      required: [postId]
      properties:
        postId:
          type: string
        permalink:
          type: ["string", "null"]
    PublishInstagramResult:
      type: object
      required: [postId]
      properties:
        postId:
          type: string
        permalink:
          type: ["string", "null"]
    LinkedInAuthUrlResult:
      type: object
      required: [url]
      properties:
        url:
          type: string
    LinkedInStatus:
      type: object
      required: [connected, configured, redirectUri]
      properties:
        connected:
          type: boolean
        accountName:
          type: ["string", "null"]
        configured:
          type: boolean
          description: Whether the platform-level LinkedIn app credentials are set by the admin.
        redirectUri:
          type: string
          description: The exact OAuth redirect URL to register in the LinkedIn app.
        expired:
          type: boolean
          description: >-
            True when an account was previously connected but its token has
            since expired or been revoked, so the user should reconnect.
    PublishLinkedInResult:
      type: object
      required: [postId]
      properties:
        postId:
          type: string
        permalink:
          type: ["string", "null"]
    TwitterAppCredentialInput:
      type: object
      required: [apiKey, apiSecret]
      properties:
        apiKey:
          type: string
          minLength: 1
        apiSecret:
          type: string
          minLength: 1
    TwitterAppCredentialStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether X app keys have been saved.
        apiKeyMasked:
          type: ["string", "null"]
        apiSecretMasked:
          type: ["string", "null"]
        testStatus:
          type: ["string", "null"]
          description: '"verified" or "failed" from the last automatic test.'
        testedAt:
          type: ["string", "null"]
          format: date-time
        testError:
          type: ["string", "null"]
    TwitterCredentialInput:
      type: object
      required: [accessToken, accessTokenSecret]
      properties:
        accessToken:
          type: string
          minLength: 1
        accessTokenSecret:
          type: string
          minLength: 1
    PublishTwitterResult:
      type: object
      required: [postId]
      properties:
        postId:
          type: string
        permalink:
          type: ["string", "null"]
    ContentItem:
      type: object
      required:
        - id
        - title
        - caption
        - platform
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        title:
          type: string
        caption:
          type: string
        imagePath:
          type: ["string", "null"]
        imagePrompt:
          type: ["string", "null"]
        platform:
          type: string
        status:
          type: string
        brandKitId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContentInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        caption:
          type: string
        imagePath:
          type: ["string", "null"]
        imagePrompt:
          type: ["string", "null"]
        platform:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
        brandKitId:
          type: ["integer", "null"]
    ContentUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        caption:
          type: string
        imagePath:
          type: ["string", "null"]
        imagePrompt:
          type: ["string", "null"]
        platform:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
        brandKitId:
          type: ["integer", "null"]

    CaptionRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          description: Topic or idea for the post.
        platform:
          type: string
        brandKitId:
          type: ["integer", "null"]
        tone:
          type: string
    CaptionResult:
      type: object
      required: [caption, hashtags]
      properties:
        caption:
          type: string
        hashtags:
          type: array
          items:
            type: string
    ImageRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        size:
          type: string
          enum: ["1024x1024", "1536x1024", "1024x1536"]
        brandKitId:
          type: ["integer", "null"]
    ImageResult:
      type: object
      required: [imagePath, b64Json]
      properties:
        imagePath:
          type: string
        b64Json:
          type: string

    TopicIdeasRequest:
      type: object
      required: [niche]
      properties:
        niche:
          type: string
          minLength: 1
          description: The niche or topic area to brainstorm ideas for.
        brandKitId:
          type: ["integer", "null"]
    TopicIdeasResult:
      type: object
      required: [ideas]
      properties:
        ideas:
          type: array
          items:
            type: string
    SummarizeUrlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          description: The article URL to fetch and summarize.
    SummarizeUrlResult:
      type: object
      required: [title, summary]
      properties:
        title:
          type: string
        summary:
          type: string
    CampaignRequest:
      type: object
      required: [prompt, platforms]
      properties:
        prompt:
          type: string
          minLength: 1
          description: Topic, idea, or summary to base the campaign on.
        platforms:
          type: array
          minItems: 1
          description: Target platforms (e.g. instagram, facebook, linkedin, twitter).
          items:
            type: string
        brandKitId:
          type: ["integer", "null"]
        tone:
          type: string
    CampaignPost:
      type: object
      required: [platform, caption, hashtags, imagePrompt]
      properties:
        platform:
          type: string
        caption:
          type: string
        hashtags:
          type: array
          items:
            type: string
        imagePrompt:
          type: string
    CampaignResult:
      type: object
      required: [posts]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/CampaignPost"

    ScheduledPost:
      type: object
      required:
        - id
        - contentItemId
        - platform
        - scheduledAt
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        contentItemId:
          type: integer
        platform:
          type: string
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScheduleInput:
      type: object
      required: [contentItemId, platform, scheduledAt]
      properties:
        contentItemId:
          type: integer
        platform:
          type: string
          minLength: 1
        scheduledAt:
          type: string
          format: date-time
    ScheduleUpdate:
      type: object
      properties:
        platform:
          type: string
          minLength: 1
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, published, failed, cancelled]

    ConnectedAccount:
      type: object
      required: [id, platform, accountName, status, canPublish, createdAt]
      properties:
        id:
          type: integer
        platform:
          type: string
        accountName:
          type: string
        status:
          type: string
        canPublish:
          type: boolean
          description: True when the account holds a valid token and can publish.
        createdAt:
          type: string
          format: date-time
    AccountInput:
      type: object
      required: [platform, accountName]
      properties:
        platform:
          type: string
          enum: [instagram, facebook, linkedin, youtube]
        accountName:
          type: string
          minLength: 1

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`).
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
