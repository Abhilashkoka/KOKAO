openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: KOKAO API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: account
    description: Current tenant profile, settings, usage, and plans.
  - name: brand-kits
    description: Brand kit management.
  - name: content
    description: Content library items.
  - name: ai
    description: AI caption, image, and video generation.
  - name: google-drive
    description: Google Drive photo import for the Video Studio.
  - name: gamification
    description: Quests, streaks, and referral credits.
  - name: schedules
    description: Scheduled posts queue.
  - name: accounts
    description: Connected social accounts.
  - name: admin
    description: Cross-tenant superadmin operations.
  - name: notifications
    description: In-app and email notification preferences and policies.
  - name: analytics
    description: Consent-gated event analytics, ingestion, and reporting.
  - name: health-report
    description: On-demand social health audit reports and score history.
  - name: ads
    description: Paid media - ad account connections, campaign management, and the draft-and-approve change flow.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get current tenant profile, usage, and plan limits
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /features:
    get:
      operationId: listFeatureFlags
      tags: [account]
      summary: Get the platform-wide feature switches (which app modules are enabled)
      responses:
        "200":
          description: Feature switches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlags"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/settings:
    patch:
      operationId: updateSettings
      tags: [account]
      summary: Update tenant settings (name, plan, AI model)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSettings"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /plans:
    get:
      operationId: listPlans
      tags: [account]
      summary: List available subscription plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /app-brand:
    get:
      operationId: getAppBrand
      tags: [appBrand]
      summary: Get the platform branding (public; used pre-auth for landing/auth/favicon)
      responses:
        "200":
          description: Current platform branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppBrand"
    put:
      operationId: updateAppBrand
      tags: [appBrand]
      summary: Update the platform branding (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppBrandInput"
      responses:
        "200":
          description: Updated platform branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppBrand"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /app-brand/upload-url:
    post:
      operationId: createAppBrandUploadUrl
      tags: [appBrand]
      summary: Mint a presigned URL to upload a public brand asset (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppBrandUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL and the resulting served path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppBrandUploadUrlResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /notification-settings:
    get:
      operationId: getNotificationSettings
      tags: [notifications]
      summary: Get the current tenant's notification preferences and effective channels
      responses:
        "200":
          description: Notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: updateNotificationSettings
      tags: [notifications]
      summary: Update the current tenant's notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsInput"
      responses:
        "200":
          description: Updated notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register (or re-bind) this device's Expo push token to the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /push-tokens/unregister:
    post:
      operationId: unregisterPushToken
      tags: [notifications]
      summary: Remove this device's Expo push token so it stops receiving pushes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenUnregisterInput"
      responses:
        "200":
          description: Token removed (idempotent — also succeeds when the token was not registered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /taste-profile:
    get:
      operationId: getTasteProfile
      tags: [account]
      summary: Get the current tenant's learned style memory summary
      responses:
        "200":
          description: Taste profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasteProfileSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: updateTasteProfile
      tags: [account]
      summary: Enable or disable style memory for the current tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TasteProfileUpdateInput"
      responses:
        "200":
          description: Updated taste profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasteProfileSummary"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: clearTasteProfile
      tags: [account]
      summary: Clear everything style memory has learned for the current tenant
      responses:
        "200":
          description: Cleared taste profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasteProfileSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /taste-profile/signal:
    post:
      operationId: recordTasteSignal
      tags: [account]
      summary: Record an approval signal for a content item (e.g. saved to library)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TasteSignalCreateInput"
      responses:
        "204":
          description: Signal recorded
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /team:
    get:
      operationId: getTeam
      tags: [account]
      summary: Get the workspace team overview (members, invites, seat requests)
      responses:
        "200":
          description: Team overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamOverview"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /team/invites:
    post:
      operationId: createTeamInvite
      tags: [account]
      summary: Invite a user to this workspace by email (owner/admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInviteCreateInput"
      responses:
        "200":
          description: Updated team overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamOverview"
        "400":
          description: Invalid request (bad email, no seats left, duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: Seat limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden (members cannot manage the team)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /team/invites/{id}:
    delete:
      operationId: revokeTeamInvite
      tags: [account]
      summary: Revoke a pending invite (owner/admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated team overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamOverview"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /team/members/{id}:
    delete:
      operationId: removeTeamMember
      tags: [account]
      summary: Remove a member from this workspace (owner/admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated team overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamOverview"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /team/seat-requests:
    post:
      operationId: createSeatRequest
      tags: [account]
      summary: Request more team seats (owner/admin only; decided by a superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatRequestCreateInput"
      responses:
        "200":
          description: Updated team overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamOverview"
        "400":
          description: Invalid request (a request is already pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /team/leave:
    post:
      operationId: leaveTeam
      tags: [account]
      summary: Leave the workspace you were invited to (members/admins only, not the owner)
      responses:
        "200":
          description: Left the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveTeamResult"
        "403":
          description: The workspace owner cannot leave their own workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No membership found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/seat-requests:
    get:
      operationId: adminListSeatRequests
      tags: [admin]
      summary: List team seat requests across all workspaces (superadmin only)
      responses:
        "200":
          description: Seat requests, pending first then most recent decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSeatRequest"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/seat-requests/{id}:
    patch:
      operationId: adminDecideSeatRequest
      tags: [admin]
      summary: Approve or deny a seat request (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatRequestDecisionInput"
      responses:
        "200":
          description: The decided seat request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSeatRequest"
        "400":
          description: Invalid request (already decided)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/tenants:
    get:
      operationId: adminListTenants
      tags: [admin]
      summary: List all tenants with usage and resource counts (superadmin only)
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTenant"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/tenants/{id}:
    patch:
      operationId: adminUpdateTenantPlan
      tags: [admin]
      summary: Update a tenant's subscription plan (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantPlanBody"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            Tenant has an active subscription; retry with
            confirmActiveSubscription true to override anyway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/plans:
    post:
      operationId: adminCreatePlan
      tags: [admin]
      summary: Create a new subscription plan (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreateInput"
      responses:
        "200":
          description: The full updated plan catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A plan with this id already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/plans/{planId}:
    delete:
      operationId: adminDeletePlan
      tags: [admin]
      summary: Delete a subscription plan (superadmin only)
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The full updated plan catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
        "400":
          description: Plan cannot be deleted (fallback plan or still in use)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Unknown plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: adminUpdatePlan
      tags: [admin]
      summary: Update a subscription plan's price, limits, and features (superadmin only)
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdateInput"
      responses:
        "200":
          description: The full updated plan catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Unknown plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/tenants/{id}/superadmin:
    patch:
      operationId: adminUpdateTenantSuperadmin
      tags: [admin]
      summary: Grant or revoke a tenant's superadmin role (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantSuperadminBody"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/tenants/{id}/design-skill:
    patch:
      operationId: adminUpdateTenantDesignSkill
      tags: [admin]
      summary: Set or clear a tenant's design-skill override (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantDesignSkillBody"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/design-skill:
    get:
      operationId: adminGetDesignSkill
      tags: [admin]
      summary: Get the global design-skill switch (superadmin only)
      responses:
        "200":
          description: Design skill settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSkillSettings"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: adminUpdateDesignSkill
      tags: [admin]
      summary: Enable or disable the design skill for all users (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDesignSkillBody"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignSkillSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/asr-settings:
    get:
      operationId: adminGetAsrSettings
      tags: [admin]
      summary: Get the speech-to-text provider selection (superadmin only)
      responses:
        "200":
          description: ASR settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsrSettingsView"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: adminUpdateAsrSettings
      tags: [admin]
      summary: Select the speech-to-text provider for the whole app (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAsrSettingsRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsrSettingsView"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/asr-providers/{providerId}/key:
    parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: adminSetAsrProviderKey
      tags: [admin]
      summary: Save a speech-to-text provider API key (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAsrProviderKeyRequest"
      responses:
        "200":
