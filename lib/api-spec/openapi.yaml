      type: object
      description: Source-of-truth brand definition stored immutably per version.
      required:
        - identity
        - logos
        - colors
        - typography
        - voice
        - visual_style
        - layout_tokens
        - channel_rules
        - brand_controls
      properties:
        identity:
          type: object
          required:
            [brand_name, brand_slug, tagline, description, industry, audience]
          properties:
            brand_name: { type: string }
            brand_slug: { type: string }
            tagline: { type: string }
            description: { type: string }
            industry: { type: string }
            audience:
              type: array
              items: { type: string }
        logos:
          type: object
          required: [primary, secondary, icon_mark, favicon, usage_rules]
          properties:
            primary:
              oneOf:
                - $ref: "#/components/schemas/BrandLogoRef"
                - type: "null"
            secondary:
              oneOf:
                - $ref: "#/components/schemas/BrandLogoRef"
                - type: "null"
            icon_mark:
              oneOf:
                - $ref: "#/components/schemas/BrandLogoRef"
                - type: "null"
            favicon:
              oneOf:
                - $ref: "#/components/schemas/BrandLogoRef"
                - type: "null"
            usage_rules:
              type: array
              items: { type: string }
        colors:
          type: object
          required: [primary, secondary, neutral, semantic]
          properties:
            primary:
              type: array
              items: { $ref: "#/components/schemas/BrandColor" }
            secondary:
              type: array
              items: { $ref: "#/components/schemas/BrandColor" }
            neutral:
              type: array
              items: { $ref: "#/components/schemas/BrandColor" }
            semantic:
              type: array
              items: { $ref: "#/components/schemas/BrandColor" }
        typography:
          type: object
          required: [heading_font, body_font, fallback_fonts, scale, weights]
          properties:
            heading_font: { type: string }
            body_font: { type: string }
            fallback_fonts:
              type: array
              items: { type: string }
            scale:
              type: object
              required: [h1, h2, h3, h4, body, small, caption]
              properties:
                h1: { type: string }
                h2: { type: string }
                h3: { type: string }
                h4: { type: string }
                body: { type: string }
                small: { type: string }
                caption: { type: string }
            weights:
              type: object
              required: [regular, medium, semibold, bold]
              properties:
                regular: { type: integer }
                medium: { type: integer }
                semibold: { type: integer }
                bold: { type: integer }
        voice:
          type: object
          required: [traits, dos, donts, caption_style, cta_style]
          properties:
            traits:
              type: array
              items: { type: string }
            dos:
              type: array
              items: { type: string }
            donts:
              type: array
              items: { type: string }
            caption_style: { type: string }
            cta_style: { type: string }
        visual_style:
          type: object
          required: [imagery_style, icon_style, illustration_style, motion_style]
          properties:
            imagery_style:
              type: array
              items: { type: string }
            icon_style: { type: string }
            illustration_style: { type: string }
            motion_style: { type: string }
        layout_tokens:
          type: object
          required: [base_unit, radius, shadow]
          properties:
            base_unit: { type: string }
            radius:
              type: object
              required: [sm, md, lg]
              properties:
                sm: { type: string }
                md: { type: string }
                lg: { type: string }
            shadow:
              type: object
              required: [sm, md, lg]
              properties:
                sm: { type: string }
                md: { type: string }
                lg: { type: string }
        channel_rules:
