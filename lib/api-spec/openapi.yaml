                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ads/linkedin/geo-search:
    get:
      operationId: searchLinkedinGeoTargets
      tags: [ads]
      summary: Typeahead search for LinkedIn location targeting entities (geo URNs)
      parameters:
        - $ref: "#/components/parameters/AdsConnectionId"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Matching locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsGeoSearchResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Platform error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ads/linkedin/targeting-search:
    get:
      operationId: searchLinkedinTargeting
      tags: [ads]
      summary: Typeahead search for LinkedIn targeting entities within one facet
      parameters:
        - $ref: "#/components/parameters/AdsConnectionId"
        - name: facet
          in: query
          required: true
          schema:
            type: string
            enum: [locations, industries, jobFunctions, titles]
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Matching targeting entities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsGeoSearchResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Platform error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ads/linkedin/campaign-targeting:
    get:
      operationId: getLinkedinCampaignTargeting
      tags: [ads]
      summary: A LinkedIn campaign's current targeting facets with names resolved from URNs
      parameters:
        - $ref: "#/components/parameters/AdsConnectionId"
        - name: campaignId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current targeting per facet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsCampaignTargeting"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Platform error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ads/campaigns:
    get:
      operationId: listAdCampaigns
      tags: [ads]
      summary: List campaigns with delivery status and metrics for a date range
      parameters:
        - $ref: "#/components/parameters/AdsConnectionId"
        - $ref: "#/components/parameters/AdsDatePreset"
      responses:
        "200":
          description: Campaigns with metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsCampaignList"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Platform error (expired token, missing permissions, API failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ads/campaign-detail:
    get:
      operationId: getAdCampaignDetail
      tags: [ads]
      summary: Campaign detail with its ad sets and ads (metrics per row)
      parameters:
        - name: campaignId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AdsConnectionId"
        - $ref: "#/components/parameters/AdsDatePreset"
      responses:
        "200":
          description: Campaign detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsCampaignDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Platform error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ads/drafts:
    get:
      operationId: listAdDrafts
      tags: [ads]
      summary: List draft change requests (pending first)
      responses:
        "200":
          description: Drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdsDraft"
    post:
      operationId: createAdDraft
      tags: [ads]
      summary: Create a draft change request with a before/after preview (owner/admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdsDraftCreateInput"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsDraft"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A draft with this idempotency key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsDraft"
        "502":
          description: Platform error while reading current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ads/drafts/{id}/approve:
    post:
      operationId: approveAdDraft
      tags: [ads]
      summary: Approve and apply a draft to the ad account (workspace OWNER only; idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The draft after the apply attempt (applied, failed, or expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsDraft"
        "403":
          description: Forbidden (only the workspace owner can approve)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: An apply for this draft is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ads/drafts/{id}/reject:
    post:
      operationId: rejectAdDraft
      tags: [ads]
      summary: Reject a draft so it can never be applied (owner/admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The rejected draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsDraft"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ads/change-log:
    get:
      operationId: listAdsChangeLog
      tags: [ads]
      summary: Append-only history of applied ads changes for this workspace
      responses:
        "200":
          description: Change log entries, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdsChangeLogEntry"
  /ads/budget-caps:
    get:
      operationId: getAdsBudgetCaps
      tags: [ads]
      summary: Get this workspace's optional ads budget caps (minor units, null = no cap)
      responses:
        "200":
          description: Budget caps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsBudgetCaps"
    put:
      operationId: updateAdsBudgetCaps
      tags: [ads]
      summary: Set or clear the workspace's ads budget caps (workspace OWNER only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdsBudgetCapsInput"
      responses:
        "200":
          description: Updated budget caps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsBudgetCaps"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden (only the workspace owner can change budget caps)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/features:
    get:
      operationId: adminListFeatureFlags
      tags: [admin]
      summary: List platform-wide feature switches with labels (superadmin only)
      responses:
        "200":
          description: Feature switches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminFeatureFlag"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/features/{feature}:
    put:
      operationId: adminUpdateFeatureFlag
      tags: [admin]
      summary: Enable or disable an app module platform-wide (superadmin only)
      parameters:
        - name: feature
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFeatureFlagInput"
      responses:
        "200":
          description: Updated switch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeatureFlag"
        "400":
          description: Unknown feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/signup-credit-settings:
    get:
      operationId: adminGetSignupCreditSettings
      tags: [admin]
      summary: Get the automatic signup credit grant configuration (superadmin only)
      responses:
        "200":
          description: Signup credit settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupCreditSettingsView"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: adminUpdateSignupCreditSettings
      tags: [admin]
      summary: Update the automatic signup credit grant configuration (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupCreditSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupCreditSettingsView"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/ads/settings:
    get:
      operationId: adminGetAdsSettings
      tags: [admin]
      summary: Get the global ads module switch and per-platform credential readiness (superadmin only)
      responses:
        "200":
          description: Ads module settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdsSettings"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: adminUpdateAdsSettings
      tags: [admin]
      summary: Enable or disable the ads module globally (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAdsSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAdsSettings"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  parameters:
    AnalyticsFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Start of the reporting window (defaults to 30 days ago).
    AnalyticsTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: End of the reporting window (defaults to now).
    AnalyticsTenantId:
      name: tenantId
      in: query
      required: false
      schema:
        type: integer
      description: Superadmin-only per-tenant drilldown; ignored otherwise.
    AdsConnectionId:
      name: connectionId
      in: query
      required: true
      schema:
        type: integer
      description: The ad account connection to read from.
    AdsDatePreset:
      name: datePreset
      in: query
      required: false
      schema:
        type: string
        enum: [today, yesterday, last_7d, last_14d, last_30d, last_90d, maximum]
      description: Reporting date range (defaults to last_30d).
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: >-
            Optional machine-readable error code. Currently
            "already_complete" on resend endpoints when there is nothing left
            to resend (e.g. a concurrent resend already posted everything).

    Tenant:
      type: object
      required: [id, name, plan, aiModel, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        plan:
          type: string
        aiModel:
          type: string
        industry:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    TenantSettings:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        plan:
          type: string
        aiModel:
          type: string
          minLength: 1
        industry:
          type: ["string", "null"]
    Usage:
      type: object
      required: [captions, images, periodStart]
      properties:
        captions:
          type: integer
        images:
          type: integer
        videos:
          type: integer
          description: AI videos generated this month against the plan quota.
        periodStart:
          type: string
          format: date-time
    PlanLimits:
      type: object
      required: [captions, images, brandKits, scheduledPosts]
      properties:
        captions:
          type: integer
          description: Monthly caption generation limit. -1 means unlimited.
        images:
          type: integer
          description: Monthly image generation limit. -1 means unlimited.
        videos:
          type: integer
          description: >-
            Monthly AI video generation limit. -1 means unlimited, 0 means
            credit-funded only. Optional so pre-video clients keep working.
        brandKits:
          type: integer
          description: Max brand kits. -1 means unlimited.
        scheduledPosts:
          type: integer
          description: Max scheduled posts. -1 means unlimited.
    MeProfile:
      type: object
      required:
        [tenant, usage, limits, isSuperadmin, isOwner, brandOnboardingComplete]
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        usage:
          $ref: "#/components/schemas/Usage"
        limits:
          $ref: "#/components/schemas/PlanLimits"
        credits:
          $ref: "#/components/schemas/CreditBalances"
          description: >-
            Prepaid credit balances. Credits are consumed automatically when
            the monthly plan quota is exhausted.
        isSuperadmin:
          type: boolean
          description: Whether the current user has cross-tenant superadmin access.
        isOwner:
          type: boolean
          description: >-
            Whether the current user is an allowlisted (root) owner. Only owners
            may grant or revoke the superadmin role for other tenants.
        brandOnboardingComplete:
          type: boolean
          description: Whether the tenant has finished (or skipped) brand onboarding.
        team:
          $ref: "#/components/schemas/TeamStatus"
        pendingInvite:
          anyOf:
            - $ref: "#/components/schemas/PendingInviteHint"
            - type: "null"
          description: >-
            For workspace owners only: a pending team invite sent to one of
            their verified emails for ANOTHER workspace (null when none).
            Invites only auto-accept on first sign-in with the invited
            address, so this lets the UI point the user at the right email.
    PendingInviteHint:
      type: object
      required: [email, workspaceName]
      properties:
        email:
          type: string
          description: The exact email address the invite was sent to.
        workspaceName:
          type: string
          description: Name of the workspace the invite is for.
    TeamStatus:
      type: object
      required: [enabled, role, seatLimit, workspaceName]
      properties:
        enabled:
          type: boolean
          description: >-
            Whether the team add-on is active for this workspace (the plan
            includes team seats or a superadmin granted a seat override).
        role:
          type: string
          enum: [owner, admin, member]
          description: The current user's role in this workspace.
        seatLimit:
          type: integer
          description: Effective seat limit (workspace override or plan default).
        workspaceName:
          type: string
          description: Name of the workspace the current user is working in.
        invitedByEmail:
          type: ["string", "null"]
          description: >-
            For invited members/admins, the email of the person who invited
            them (null when unknown). Always null for the owner.
        joinedAt:
          type: ["string", "null"]
          format: date-time
          description: When the current user joined this workspace (members only).
    LeaveTeamResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    TeamMember:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [owner, admin, member]
        createdAt:
          type: string
          format: date-time
    TeamInvite:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [pending, accepted, revoked]
        createdAt:
          type: string
          format: date-time
    SeatRequest:
      type: object
      required: [id, requestedSeats, note, status, grantedSeats, createdAt]
      properties:
        id:
          type: integer
        requestedSeats:
          type: integer
        note:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, denied]
        grantedSeats:
          type: ["integer", "null"]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    TeamOverview:
      type: object
      required:
        [enabled, role, seatLimit, seatsUsed, members, invites, seatRequests]
      properties:
        enabled:
          type: boolean
        role:
          type: string
          enum: [owner, admin, member]
        seatLimit:
          type: integer
        seatsUsed:
          type: integer
          description: Owner + members + pending invites.
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        invites:
          type: array
          items:
            $ref: "#/components/schemas/TeamInvite"
        seatRequests:
          type: array
          items:
            $ref: "#/components/schemas/SeatRequest"
    TeamInviteCreateInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          type: string
          enum: [admin, member]
          default: member
    SeatRequestCreateInput:
      type: object
      required: [requestedSeats]
      properties:
        requestedSeats:
          type: integer
          minimum: 1
          maximum: 1000
        note:
          type: string
          maxLength: 1000
    AdminSeatRequest:
      type: object
      required:
        [
          id,
          tenantId,
          tenantName,
          tenantEmail,
          tenantPlan,
          currentSeatLimit,
          seatsUsed,
          requestedSeats,
          note,
          status,
          grantedSeats,
          createdAt,
        ]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        tenantName:
          type: string
        tenantEmail:
          type: ["string", "null"]
        tenantPlan:
          type: string
        currentSeatLimit:
          type: integer
          description: Effective seat limit for the workspace right now.
        seatsUsed:
          type: integer
        requestedSeats:
          type: integer
        note:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, denied]
        grantedSeats:
          type: ["integer", "null"]
        decidedByEmail:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    SeatRequestDecisionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, deny]
        seats:
          type: integer
          minimum: 1
          maximum: 1000
          description: >-
            Seats to grant on approval. Defaults to the requested amount.
            Ignored when denying.
    AppBrand:
      type: object
      required:
        [appName, logoUrl, iconUrl, primaryColor, backgroundColor, loaderAnimationUrl]
      properties:
        appName:
          type: ["string", "null"]
          description: Overrides the app name in the title and alt text.
        logoUrl:
          type: ["string", "null"]
          description: Public served path of the logo shown in nav and landing.
        iconUrl:
          type: ["string", "null"]
          description: Public served path of the favicon / app icon.
        primaryColor:
          type: ["string", "null"]
          description: Hex primary/accent color applied to the theme.
        backgroundColor:
          type: ["string", "null"]
          description: Hex app background color applied to the theme.
        loaderAnimationUrl:
          type: ["string", "null"]
          description: Public served path of a custom loading animation image (SVG/GIF/APNG/WebP) shown instead of the built-in loader.
    AppBrandInput:
      type: object
      properties:
        appName:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        iconUrl:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        backgroundColor:
          type: ["string", "null"]
        loaderAnimationUrl:
          type: ["string", "null"]
    AppBrandUploadUrlBody:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          description: MIME type of the asset to upload (e.g. image/png).
    AppBrandUploadUrlResponse:
      type: object
      required: [uploadURL, servedPath]
      properties:
        uploadURL:
          type: string
          description: Presigned URL to PUT the file bytes to.
        servedPath:
          type: string
          description: Browser-facing path where the uploaded asset will be served.
    Plan:
      type: object
      required: [id, name, priceLabel, limits, features, teamSeats]
      properties:
        id:
          type: string
        name:
          type: string
        priceLabel:
          type: string
        limits:
          $ref: "#/components/schemas/PlanLimits"
        features:
          type: array
          items:
            type: string
        teamSeats:
          type: integer
          description: >-
            Team add-on: default seat allotment (including the owner) for
            workspaces on this plan. 0 means the team feature is not included.
        priceInr:
          type: ["integer", "null"]
          description: Subscription price in paise (INR x 100). Null = not purchasable online.
        razorpayPlanId:
          type: ["string", "null"]
        priceInrYearly:
          type: ["integer", "null"]
          description: >-
            Total yearly price in paise (charged once per year). Null = no
            annual billing option for this plan.
        razorpayPlanIdYearly:
          type: ["string", "null"]

    PlanCreateInput:
      type: object
      required: [name, priceLabel, limits, features]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^[a-z0-9][a-z0-9-]*$"
          description: >-
            Optional url-safe id (lowercase letters, digits, dashes). Derived
            from the name when omitted.
        name:
          type: string
          minLength: 1
          maxLength: 60
        priceLabel:
          type: string
          minLength: 1
          maxLength: 40
        limits:
          $ref: "#/components/schemas/PlanLimits"
        features:
          type: array
          maxItems: 12
          items:
