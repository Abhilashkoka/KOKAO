    UpdateAiSpendSettingsRequest:
      type: object
      required: [captionCostPaise, imageCostPaise, feePercent]
      properties:
        captionCostPaise:
          type: integer
          minimum: 0
        imageCostPaise:
          type: integer
          minimum: 0
        feePercent:
          type: integer
          minimum: 0
          maximum: 1000
    AiSpendRatesView:
      type: object
      description: Effective per-unit display amounts (base cost + platform fee, combined).
      required: [captionPaise, imagePaise]
      properties:
        captionPaise:
          type: integer
          description: Amount shown per generated caption, in paise (fee included).
        imagePaise:
          type: integer
          description: Amount shown per generated image, in paise (fee included).
    AdminFeatureFlag:
      type: object
      required: [feature, label, description, enabled]
      properties:
        feature:
          type: string
        label:
          type: string
        description:
          type: string
        enabled:
          type: boolean
    AdminFeatureFlagInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    AdminAdsSettings:
      type: object
      required: [enabled, platforms]
      properties:
        enabled:
          type: boolean
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/AdminAdsPlatformSlot"
    AdminAdsSettingsInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    AdsBudgetCaps:
      type: object
      required: [maxDailyBudget, maxLifetimeBudget]
      properties:
        maxDailyBudget:
          type: ["integer", "null"]
          description: Maximum allowed daily budget in minor currency units; null = no cap.
        maxLifetimeBudget:
          type: ["integer", "null"]
          description: Maximum allowed lifetime budget in minor currency units; null = no cap.
    AdsBudgetCapsInput:
      type: object
      required: [maxDailyBudget, maxLifetimeBudget]
      properties:
        maxDailyBudget:
          type: ["integer", "null"]
          minimum: 1
          description: Maximum allowed daily budget in minor currency units; null clears the cap.
        maxLifetimeBudget:
          type: ["integer", "null"]
          minimum: 1
          description: Maximum allowed lifetime budget in minor currency units; null clears the cap.
