  /ai/video-jobs/{jobId}/storyboard:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateVideoStoryboard
      tags: [ai]
      summary: Edit the scenes of a paused storyboard
      description: >-
        Only valid while the job's status is awaiting_review. Scenes are
        addressed by id; unlisted scenes keep their current values. Editing a
        scene's visual does not regenerate its preview — that is a separate
        call, so a user can retype several scenes and only pay preview time for
        the ones they want to see.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoryboardRequest"
      responses:
        "200":
          description: The job with its updated storyboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoJob"
        "400":
          description: Not awaiting review, unknown scene id, or a locked field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ai/video-jobs/{jobId}/storyboard/scenes/{sceneId}/preview:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
      - name: sceneId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: regenerateStoryboardScenePreview
      tags: [ai]
      summary: Regenerate one scene's preview image from its current prompt
      description: >-
        Runs the same image step the render will use, so the returned preview is
        the frame that gets animated on approve. Unbilled but capped per
        storyboard; the cap is reported back as regenerations on the storyboard.
      responses:
        "200":
          description: The job with the scene's new preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoJob"
        "400":
          description: Not awaiting review, unknown scene id, or cap reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The image provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /ai/video-jobs/{jobId}/storyboard/approve:
