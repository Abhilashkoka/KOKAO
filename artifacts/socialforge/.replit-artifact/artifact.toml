kind = "web"
previewPath = "/"
title = "SocialForge"
version = "1.0.0"
id = "artifacts/socialforge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18493

[services.development]
run = "pnpm --filter @workspace/socialforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/socialforge", "run", "build" ]
publicDir = "artifacts/socialforge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18493"
BASE_PATH = "/"
