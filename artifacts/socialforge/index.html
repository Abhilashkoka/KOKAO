          "@type": "Question",
          "name": "Who is KOKAO for?",
          "acceptedAnswer": {
            "@type": "Answer",

          "@type": "Question",
          "name": "How much does KOKAO cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Signing up is free. KOKAO offers subscription plans and prepaid credit or wallet billing for AI generation; current plans and pricing are shown inside the app after sign-up."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need my own AI or design tools to use KOKAO?",
          "acceptedAnswer": {

            "text": "No. AI copywriting, image generation and video generation are built in, along with brand kits that keep every asset on-brand — no separate design tools or AI subscriptions required."
