    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Will the content actually sound like me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — KOKAO builds a brand voice profile from your answers and past posts, and every draft is yours to edit before it ships. Most users approve drafts untouched within a week of training."

        },
        {
          "@type": "Question",
          "name": "Which platforms does KOKAO publish to?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LinkedIn, Instagram, X, Threads, Facebook, TikTok, YouTube Community and Pinterest — with each post automatically reformatted for the platform."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need any design or writing skills?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "None. KOKAO writes, designs and schedules everything. You just approve — or tweak, if you feel like it."
          }
        },
        {
          "@type": "Question",
          "name": "Can I cancel anytime?",
          "acceptedAnswer": {

  <body>
    <div id="root">
      <main
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#faf9f6;color:#211b35;font-family:Inter,system-ui,sans-serif;text-align:center"
      >
        <div id="boot-fallback" style="max-width:420px">
          <div style="font-size:28px;font-weight:800;letter-spacing:-0.04em">KOKAO</div>
          <p style="margin:14px 0 0;font-size:15px;color:#625c70">Loading your workspace…</p>
          <p id="boot-recovery-message" style="margin:10px 0 0;font-size:13px;color:#817a8e">
            Starting the app…
          </p>
        </div>
      </main>
    </div>
    <script>
      window.setTimeout(function () {
        if (!document.getElementById("boot-fallback")) return;

        var url = new URL(window.location.href);
        if (!url.searchParams.has("__kokao_boot_retry")) {
          url.searchParams.set("__kokao_boot_retry", Date.now().toString());
          window.location.replace(url.toString());
          return;
        }

        var message = document.getElementById("boot-recovery-message");
        if (message) {
          message.innerHTML =
            'The preview did not start. <a href="' +
            window.location.pathname +
            '" style="color:#5b36e8;font-weight:600">Reload KOKAO</a>';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx?v=20260902-boot2"></script>
  </body>
