kind = "video"
previewPath = "/kokao-promo/"
title = "KOKAO Promo Video"
version = "1.0.0"
id = "artifacts/kokao-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/kokao-promo/" ]
localPort = 23291

[services.development]
run = "pnpm --filter @workspace/kokao-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kokao-promo", "run", "build" ]
publicDir = "artifacts/kokao-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23291"
BASE_PATH = "/kokao-promo/"
